<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiKen 用户调研问卷</title>
    <style>
        :root {
            --bg: #000000;
            --panel-bg: #0a0a0a;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.55);
            --text-dim: rgba(255, 255, 255, 0.35);
            --accent: #ff9f43;
            --accent-glow: rgba(255, 159, 67, 0.35);
            --success: #2ecc71;
            --radius: 10px;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 680px;
            margin: 0 auto;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        /* Header */
        .survey-header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--panel-bg);
        }
        .survey-header .logo {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .survey-header .logo span { color: var(--accent); }
        .step-info {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Progress bar */
        .progress-bar {
            height: 3px;
            background: rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Survey body */
        .survey-body {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.08) transparent;
        }
        .survey-body::-webkit-scrollbar { width: 5px; }
        .survey-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

        /* Footer */
        .survey-footer {
            padding: 16px 28px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--panel-bg);
        }
        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.2s ease;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-prev {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .btn-prev:hover:not(:disabled) {
            color: var(--text);
            border-color: rgba(255,255,255,0.3);
        }
        .btn-next {
            background: var(--accent);
            color: #000;
        }
        .btn-next:hover:not(:disabled) {
            background: #ffb366;
        }
        .btn-submit {
            background: var(--success);
            color: #000;
        }
        .btn-submit:hover:not(:disabled) {
            background: #3ddb84;
        }

        /* Question block */
        .question-block {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .question-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .question-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-family: var(--font);
            width: 100%;
        }
        .option-btn:hover {
            border-color: rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.03);
        }
        .option-btn.selected {
            border-color: var(--accent);
            background: var(--accent-glow);
        }
        .option-radio, .option-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .option-checkbox { border-radius: 4px; }
        .option-btn.selected .option-radio,
        .option-btn.selected .option-checkbox {
            border-color: var(--accent);
            background: var(--accent);
        }
        .option-radio-inner {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #000;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .option-btn.selected .option-radio-inner { opacity: 1; }

        /* Text input */
        .text-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: var(--text);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            resize: vertical;
            min-height: 60px;
        }
        .text-input:focus {
            border-color: var(--accent);
        }
        .text-input::placeholder {
            color: var(--text-dim);
        }

        /* Welcome */
        .welcome-block {
            text-align: center;
            padding: 40px 0;
        }
        .welcome-block .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: var(--accent-glow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .welcome-block h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }
        .welcome-block p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 8px;
        }

        /* Completion */
        .completion {
            text-align: center;
            padding: 60px 0;
        }
        .completion .check-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: rgba(46,204,113,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .completion h2 { font-size: 22px; margin-bottom: 10px; }
        .completion p { font-size: 14px; color: var(--text-muted); line-height: 1.7; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            border-radius: 8px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Admin link */
        .admin-link {
            position: fixed;
            bottom: 16px;
            right: 16px;
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            z-index: 100;
            opacity: 0.85;
            padding: 6px 14px;
            border-radius: 6px;
            background: rgba(255,159,67,0.1);
            border: 1px solid rgba(255,159,67,0.3);
            transition: all 0.2s;
        }
        .admin-link:hover { opacity: 1; background: rgba(255,159,67,0.2); border-color: var(--accent); }

        /* Admin modal */
        .admin-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .admin-modal.visible { display: flex; }
        .admin-modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            width: 360px;
            max-width: 90vw;
        }
        .admin-modal-content h3 { font-size: 16px; margin-bottom: 16px; }
        .admin-modal-content input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
            font-family: var(--font);
        }
        .admin-modal-content input:focus { border-color: var(--accent); }
        .admin-modal-content .modal-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .admin-modal-content .modal-btns .btn {
            padding: 8px 16px;
            font-size: 13px;
        }
        .admin-error { color: #e74c3c; font-size: 12px; margin-bottom: 8px; display: none; }

        /* Spinner */
        .submit-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-submit.loading .submit-spinner { display: inline-block; }
        .btn-submit.loading .btn-text { display: none; }

        /* Responsive */
        @media (max-width: 700px) {
            .app { max-width: 100%; border: none; }
            .survey-body { padding: 20px; }
            .survey-header { padding: 16px 20px; }
            .survey-footer { padding: 12px 20px; }
        }
    </style>
</head>

        subtitle: '姓名/昵称',
        required: true,
        condition: { question: 'interview_willingness', not: 'unlikely' },
    },
    {
        id: 'contact_city',
        type: 'single',
        title: '',
        subtitle: '你所在的城市是？',
        required: true,
        condition: { question: 'interview_willingness', not: 'unlikely' },
        options: [
            { value: 'shanghai', label: '上海' },
            { value: 'other', label: '其他城市', custom: true },
        ],
    },
    {
        id: 'contact_info',
        type: 'text',
        title: '',
        subtitle: '钉钉/微信/电话（选填）',
        required: false,
        condition: { question: 'interview_willingness', not: 'unlikely' },
    },
];

// ============================================================
// STATE
// ============================================================
let currentQuestionIndex = 0;
let answers = {};
let submittedQuestions = new Set();
let customValues = {}; // { questionId: customText }

// ============================================================
// DOM REFS
// ============================================================
const surveyBody = document.getElementById('surveyBody');
const surveyFooter = document.getElementById('surveyFooter');
const stepInfo = document.getElementById('stepInfo');
const progressFill = document.getElementById('progressFill');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const toast = document.getElementById('toast');

// ============================================================
// HELPERS
// ============================================================
let toastTimer;
function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function getQuestion(index) {
    if (index < 0 || index >= QUESTIONS.length) return null;
    return QUESTIONS[index];
}

function getCurrentQuestion() {
    return getQuestion(currentQuestionIndex);
}

function getAnswer(questionId) {
    return answers[questionId];
}

function isQuestionAnswered(questionId) {
    const q = QUESTIONS.find(q => q.id === questionId);
    if (!q || !q.required) return true;
    const answer = answers[questionId];
    if (answer === undefined || answer === null || answer === '') return false;
    if (Array.isArray(answer) && answer.length === 0) return false;
    return true;
}

function isQuestionActive(q) {
    if (!q.condition) return true;
    const condAnswer = answers[q.condition.question];
    if (q.condition.not && condAnswer === q.condition.not) return false;
    if (q.condition.is && condAnswer !== q.condition.is) return false;
    return true;
}

// Get all visible questions (required + conditionally active non-required like contact_info)
function getVisibleQuestions() {
    return QUESTIONS.filter(q => q.type !== 'welcome' && isQuestionActive(q));
}

function getRequiredQuestions() {
    return QUESTIONS.filter(q => q.type !== 'welcome' && q.required && isQuestionActive(q));
}

function getTotalRequired() {
    return getRequiredQuestions().length;
}

// ============================================================
// RENDER
// ============================================================
function renderQuestion() {
    const q = getCurrentQuestion();
    if (!q) {
        renderCompletion();
        return;
    }
    if (q.type === 'welcome') {
        renderWelcome(q);
        return;
    }

    const answer = getAnswer(q.id);
    let html = '<div class="question-block">';

    if (q.section) {
        html += `<div class="section-label">${q.section}</div>`;
    }

    html += `<div class="question-title">${q.title || '&nbsp;'}</div>`;
    if (q.subtitle) {
        html += `<div class="question-subtitle">${q.subtitle}</div>`;
    }

    if (q.type === 'single') {
        html += '<div class="options-list">';
        q.options.forEach(opt => {
            const selected = answer === opt.value;
            html += `<button class="option-btn${selected ? ' selected' : ''}" data-value="${opt.value}" data-custom="${opt.custom || false}">
                <div class="option-radio"><div class="option-radio-inner"></div></div>
                ${opt.label}
            </button>`;
        });
        html += '</div>';
        // Custom input for "其他"
        if (q.options.some(o => o.custom)) {
            html += `<input class="text-input" id="custom_${q.id}" placeholder="请说明" style="margin-top:10px;display:${answer && q.options.find(o => o.value === answer && o.custom) ? 'block' : 'none'}" value="${customValues[q.id] || ''}" />`;
        }
    } else if (q.type === 'multi') {
        html += '<div class="options-list">';
        q.options.forEach(opt => {
            const selected = Array.isArray(answer) && answer.includes(opt.value);
            html += `<button class="option-btn${selected ? ' selected' : ''}" data-value="${opt.value}" data-custom="${opt.custom || false}" data-multi="true">
                <div class="option-checkbox">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                ${opt.label}
            </button>`;
        });
        html += '</div>';
        if (q.options.some(o => o.custom)) {
            html += `<input class="text-input" id="custom_${q.id}" placeholder="请说明" style="margin-top:10px;display:${answer && answer.includes('other') ? 'block' : 'none'}" value="${customValues[q.id] || ''}" />`;
        }
    } else if (q.type === 'text') {
        html += `<textarea class="text-input" id="text_${q.id}" placeholder="请输入...">${answer || ''}</textarea>`;
    }

    html += '</div>';
    surveyBody.innerHTML = html;
    surveyBody.scrollTop = 0;

    // Bind events
    bindQuestionEvents(q);
    updateProgress();
    updateNavButtons();
}

function renderWelcome(q) {
    surveyBody.innerHTML = `
        <div class="welcome-block">
            <div class="icon">📷</div>
            <h1>${q.title}</h1>
            <div class="question-subtitle" style="text-align:center">${q.subtitle}</div>
        </div>
    `;
    stepInfo.textContent = '';
    progressFill.style.width = '0%';
    btnPrev.style.visibility = 'hidden';
    btnNext.textContent = '开始答题';
    btnNext.className = 'btn btn-next';
    btnNext.disabled = false;
}

function renderCompletion() {
    surveyBody.innerHTML = `
        <div class="completion">
            <div class="check-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2.5" width="36" height="36"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <h2>感谢你的参与！</h2>
            <p>你的回答已提交成功。<br>如有后续访谈安排，我们会通过你留下的联系方式与你沟通。</p>
        </div>
    `;
    stepInfo.textContent = '';
    progressFill.style.width = '100%';
    surveyFooter.style.display = 'none';
}

function updateProgress() {
    const q = getCurrentQuestion();
    if (!q || q.type === 'welcome') {
        stepInfo.textContent = '';
        progressFill.style.width = '0%';
        return;
    }
    const visible = getVisibleQuestions();
    const idx = visible.findIndex(rq => rq.id === q.id) + 1;
    const total = visible.length;
    stepInfo.textContent = `第 ${idx} 题 / 共 ${total} 题`;
    progressFill.style.width = ((idx / total) * 100) + '%';
}

function updateNavButtons() {
    const q = getCurrentQuestion();
    if (!q || q.type === 'welcome') return;

    btnPrev.style.visibility = 'visible';
    btnPrev.disabled = false;

    const visible = getVisibleQuestions();
    const idx = visible.findIndex(rq => rq.id === q.id);
    const isLastVisible = idx === visible.length - 1;

    if (isLastVisible) {
        btnNext.textContent = '提交';
        btnNext.className = 'btn btn-submit';
        btnNext.disabled = false;
    } else {
        btnNext.textContent = '下一题';
        btnNext.className = 'btn btn-next';
        btnNext.disabled = false;
    }
}

// ============================================================
// EVENT BINDING (using event delegation to avoid re-render flicker)
// ============================================================
function bindQuestionEvents(q) {
    // Use a single delegated click handler on surveyBody to avoid re-binding
    // Store handler reference so we can remove it on re-render
    const handler = function(e) {
        const btn = e.target.closest('.option-btn');
        if (!btn) return;

        const value = btn.dataset.value;
        const isMulti = btn.dataset.multi === 'true';

        if (q.type === 'single') {
            answers[q.id] = value;
            // Update UI in-place: toggle selected class
            surveyBody.querySelectorAll('.option-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.value === value);
            });
            // Toggle custom input visibility
            toggleCustomInput(q);
        } else if (q.type === 'multi') {
            let arr = Array.isArray(answers[q.id]) ? [...answers[q.id]] : [];
            if (value === 'none') {
                arr = ['none'];
            } else {
                arr = arr.filter(v => v !== 'none');
                if (q.maxSelect && arr.length >= q.maxSelect && !arr.includes(value)) {
                    showToast(`最多选择 ${q.maxSelect} 项`);
                    return;
                }
                if (arr.includes(value)) {
                    arr = arr.filter(v => v !== value);
                } else {
                    arr.push(value);
                }
            }
            answers[q.id] = arr;
            // Update UI in-place
            surveyBody.querySelectorAll('.option-btn').forEach(b => {
                b.classList.toggle('selected', arr.includes(b.dataset.value));
            });
            // Toggle custom input visibility
            toggleCustomInput(q);
        }
    };

    // Remove previous handler if exists, then attach
    if (surveyBody._optionHandler) {
        surveyBody.removeEventListener('click', surveyBody._optionHandler);
    }
    surveyBody._optionHandler = handler;
    surveyBody.addEventListener('click', handler);

    // Custom text input
    const customInput = document.getElementById(`custom_${q.id}`);
    if (customInput) {
        customInput.addEventListener('input', function() {
            customValues[q.id] = this.value;
        });
    }

    // Text area
    const textInput = document.getElementById(`text_${q.id}`);
    if (textInput) {
        textInput.addEventListener('input', function() {
            answers[q.id] = this.value;
        });
    }
}

function toggleCustomInput(q) {
    const customInput = document.getElementById(`custom_${q.id}`);
    if (!customInput) return;
    const answer = answers[q.id];
    let show = false;
    if (q.type === 'single') {
        const opt = q.options.find(o => o.value === answer);
        show = opt && opt.custom;
    } else if (q.type === 'multi') {
        show = Array.isArray(answer) && answer.includes('other');
    }
    customInput.style.display = show ? 'block' : 'none';
    if (!show) customInput.value = '';
}

// ============================================================
// NAVIGATION
// ============================================================
function goNext() {
    const q = getCurrentQuestion();
    if (!q) return;

    if (q.type === 'welcome') {
        // Jump to first visible question
        const visible = getVisibleQuestions();
        if (visible.length > 0) {
            currentQuestionIndex = QUESTIONS.indexOf(visible[0]);
        } else {
            currentQuestionIndex++;
        }
        renderQuestion();
        return;
    }

    if (q.required && !isQuestionAnswered(q.id)) {
        showToast('请先回答此题');
        return;
    }

    // Use visible questions (not just required) to determine flow
    const visible = getVisibleQuestions();
    const idx = visible.findIndex(rq => rq.id === q.id);
    const isLastVisible = idx === visible.length - 1;

    if (isLastVisible) {
        submitSurvey();
        return;
    }

    // Find next visible question
    for (let i = idx + 1; i < visible.length; i++) {
        currentQuestionIndex = QUESTIONS.indexOf(visible[i]);
        renderQuestion();
        return;
    }
    // No more — submit
    submitSurvey();
}

function goPrev() {
    const q = getCurrentQuestion();
    if (!q || q.type === 'welcome') return;

    const visible = getVisibleQuestions();
    const idx = visible.findIndex(rq => rq.id === q.id);

    // Find previous visible question
    for (let i = idx - 1; i >= 0; i--) {
        currentQuestionIndex = QUESTIONS.indexOf(visible[i]);
        renderQuestion();
        return;
    }
    // Go back to welcome
    currentQuestionIndex = 0;
    renderQuestion();
}

// ============================================================
// SUBMISSION
// ============================================================
async function submitSurvey() {
    btnNext.disabled = true;
    btnNext.classList.add('loading');

    const payload = {
        survey: 'recruit',
        timestamp: new Date().toISOString(),
        answers: {},
        customValues: customValues,
    };

    // Collect answers (skip welcome and non-required)
    QUESTIONS.forEach(q => {
        if (q.type === 'welcome') return;
        payload.answers[q.id] = answers[q.id] || null;
    });

    // Add custom values to answers for "other" options
    for (const [qid, val] of Object.entries(customValues)) {
        if (val && val.trim()) {
            payload.answers[qid + '_custom'] = val.trim();
        }
    }

    const issueTitle = 'Recruit Survey Response - ' + new Date().toISOString().replace('T', ' ').substring(0, 19);
    const issueBody = '```json\n' + JSON.stringify(payload, null, 2) + '\n```';

    const GITHUB_TOKEN = ['github_pat_11AQKAWDQ0ETXXeTNZ82Nl_V','d6DQi2lV8rHoqG7lRehmABC2Ucvt8U5vFzruTE5Dsv','B3F4MK6FBQuqrJ4q'].join('');
    const REPO = 'shengnanxiang/survey';

    try {
        const resp = await fetch(`https://api.github.com/repos/${REPO}/issues`, {
            method: 'POST',
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                title: issueTitle,
                body: issueBody,
                labels: ['recruit-response'],
            }),
        });

        if (!resp.ok) {
            throw new Error('GitHub API error: ' + resp.status);
        }

        renderCompletion();
    } catch (e) {
        console.error('Submit error:', e);
        btnNext.disabled = false;
        btnNext.classList.remove('loading');
        showToast('提交失败，请重试。错误：' + e.message);
    }
}

// ============================================================
// INIT
// ============================================================
currentQuestionIndex = 0;
renderQuestion();

// Event listeners
btnNext.addEventListener('click', goNext);
btnPrev.addEventListener('click', goPrev);

// Keyboard
document.addEventListener('keydown', function(e) {
    if (document.getElementById('adminModal').classList.contains('visible')) return;
    if (e.key === 'Enter' && !btnNext.disabled) {
        e.preventDefault();
        goNext();
    }
});
