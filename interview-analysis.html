<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiKen 1对1访谈分析报告</title>
<style>
/* ============ 复古胶片 · 暖棕纸感 主题 ============ */
:root{
  --bg:#f6f1e7;            /* 暖米白纸感背景 */
  --bg-deep:#efe6d5;
  --panel:#fffdf8;         /* 卡片纸色 */
  --panel2:#f7efdf;        /* 表头/嵌套区 */
  --border:#e4d7bd;        /* 暖棕边框 */
  --border-soft:#efe4d0;
  --text:#3b2a1c;          /* 深棕墨色 */
  --soft:#6b5740;          /* 次级棕 */
  --muted:#9a8468;         /* 弱化棕 */
  --accent:#a8501c;        /* 深棕红主色 */
  --accent2:#d97a2a;       /* 暖橙 */
  --success:#6e944f;       /* 橄榄绿 */
  --warn:#c9932e;          /* 芥末黄 */
  --danger:#bc4b34;        /* 砖红 */
  --radius:14px;
  --shadow:0 2px 10px rgba(120,90,50,.08);
  --shadow-hover:0 6px 20px rgba(120,90,50,.14);
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-display:"Georgia","Songti SC","STSong","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.7}
body{display:flex;flex-direction:column;min-height:100vh;
  background-image:radial-gradient(ellipse at top,rgba(217,122,42,.06),transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 27px,rgba(180,140,80,.03) 27px 28px);
}

/* ---------- 顶部工具栏：深棕红胶片头 ---------- */
.toolbar{
  padding:18px 28px 16px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(160deg,#7a3b10,#94481a 55%,#a8501c);
  color:#f7ecd8;position:sticky;top:0;z-index:10;
  box-shadow:0 3px 14px rgba(90,50,10,.35);
}
.toolbar h1{font-size:21px;font-weight:700;font-family:var(--font-display);letter-spacing:.02em}
.toolbar h1 span{color:#f0b877;font-weight:600}
.toolbar-right{display:flex;align-items:center;gap:16px}
.toolbar-right .meta{font-size:12px;color:#e8d3b4}
.btn-back{padding:5px 12px;font-size:11px;border-radius:6px;background:rgba(255,240,215,.12);border:1px solid rgba(255,240,215,.4);color:#f7ecd8;cursor:pointer;text-decoration:none;font-family:var(--font-body);transition:all .2s}
.btn-back:hover{background:rgba(255,240,215,.25);color:#fff}

/* ---------- 胶片齿孔装饰带 ---------- */
.film-strip{
  height:14px;background:linear-gradient(160deg,#7a3b10,#a8501c);
  display:flex;justify-content:space-between;padding:0 8px;
  border-bottom:2px solid #f0b877;
}
.film-strip span{width:10px;border-radius:2px;background:#f6f1e7;opacity:.85}

/* ---------- 导航标签 ---------- */
.nav-tabs{display:flex;gap:8px;padding:0 28px;margin-top:20px;flex-wrap:wrap}
.nav-tab{
  padding:9px 20px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel);color:var(--soft);font-size:13px;cursor:pointer;
  font-family:var(--font-body);transition:all .2s;box-shadow:var(--shadow);
}
.nav-tab:hover{border-color:var(--accent2);color:var(--accent)}
.nav-tab.active{
  background:linear-gradient(160deg,#94481a,#a8501c);color:#fdf3e2;
  border-color:#a8501c;box-shadow:0 3px 10px rgba(168,80,28,.3);
}

/* ---------- 主内容区 ---------- */
.main{flex:1;overflow-y:auto;padding:26px 28px 60px;scrollbar-width:thin;scrollbar-color:rgba(150,110,60,.25) transparent}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:rgba(150,110,60,.25);border-radius:3px}
.section{margin-bottom:36px;display:none}.section.active{display:block}
.section-title{
  font-size:24px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:12px;
  font-family:var(--font-display);color:#5a3a1a;letter-spacing:.02em;
}
.section-title::before{content:'';width:6px;height:26px;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:3px;flex-shrink:0}
.section-desc{font-size:13px;color:var(--muted);margin-bottom:24px;padding-left:18px}

/* ---------- 数据卡片 ---------- */
.summary-row{display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.summary-card{
  flex:1;min-width:160px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 20px;transition:all .25s;box-shadow:var(--shadow);
}
.summary-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#d9b98c}
.summary-card .label{font-size:12px;color:var(--muted);margin-bottom:8px}
.summary-card .value{font-size:28px;font-weight:700;font-family:var(--font-display);color:#5a3a1a}
.summary-card .sub{font-size:11px;color:var(--muted);margin-top:4px}
.card-pos .value{color:var(--success)}.card-neu .value{color:var(--warn)}.card-neg .value{color:var(--danger)}

/* ---------- 洞察/提示框 ---------- */
.insight-box{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.insight-box h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--accent)}
.insight-box ul{list-style:none;padding:0}
.insight-box ul li{font-size:13px;color:var(--soft);padding:4px 0 4px 18px;position:relative}
.insight-box ul li::before{content:'\25B8';position:absolute;left:0;color:var(--accent2)}

/* ---------- 个人卡片 ---------- */
.person-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;transition:all .2s;box-shadow:var(--shadow)}
.person-card:hover{box-shadow:var(--shadow-hover);border-color:#d9b98c}
.person-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.person-name{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;font-family:var(--font-display);color:#5a3a1a}
.person-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.tag-pos{background:rgba(110,148,79,.12);color:var(--success)}
.tag-neu{background:rgba(201,147,46,.14);color:var(--warn)}
.tag-neg{background:rgba(188,75,52,.12);color:var(--danger)}
.tag-warn{background:rgba(201,147,46,.1);color:var(--warn);border:1px solid rgba(201,147,46,.3)}
.person-meta{display:flex;gap:8px;flex-wrap:wrap}
.meta-chip{font-size:11px;padding:3px 10px;border-radius:5px;background:var(--panel2);color:var(--muted);border:1px solid var(--border-soft)}
.person-body{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.person-body{grid-template-columns:1fr}}
.person-field .field-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;margin-top:10px}
.person-field .field-value{font-size:13px;color:var(--soft);margin-bottom:8px}
.quote-block{background:rgba(168,80,28,.06);border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;padding:10px 16px;margin:8px 0;font-size:13px;color:var(--soft);font-style:italic}
.quote-block::before{content:'\201C';font-size:20px;color:var(--accent2);margin-right:4px}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--panel2);padding:12px 14px;text-align:left;font-weight:600;border-bottom:2px solid #dcc9a4;white-space:nowrap;color:#5a3a1a}
td{padding:10px 14px;border-bottom:1px solid var(--border-soft);color:var(--soft);vertical-align:top}
tr:hover td{background:rgba(217,122,42,.04)}
.att-up{color:var(--success);font-weight:600}.att-down{color:var(--danger);font-weight:600}.att-same{color:var(--muted)}

/* ---------- 图表 ---------- */
.chart-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.chart-title{font-size:14px;font-weight:600;margin-bottom:16px;color:#5a3a1a}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{width:130px;flex-shrink:0;text-align:right;font-size:12px;color:var(--soft);white-space:nowrap}
.bar-track{flex:1;height:22px;background:var(--bg-deep);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#fff;font-weight:600}
.bar-fill.green{background:linear-gradient(90deg,#6e944f,#8fb06a)}
.bar-fill.red{background:linear-gradient(90deg,#bc4b34,#d97a2a)}
.bar-fill.orange{background:linear-gradient(90deg,#c9932e,#d97a2a)}

/* ---------- 提示条 ---------- */
.callout{background:rgba(110,148,79,.07);border:1px solid rgba(110,148,79,.25);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;font-size:13px;color:var(--soft)}
.callout.warn{background:rgba(201,147,46,.07);border-color:rgba(201,147,46,.25)}
.callout.danger{background:rgba(188,75,52,.07);border-color:rgba(188,75,52,.25)}
.callout strong{color:#4a3018}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}
.divider{height:1px;background:var(--border);margin:28px 0}
.footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:var(--bg-deep)}
p{font-size:14px;color:var(--soft);margin-bottom:12px;line-height:1.8}
h3.sub-title{font-size:16px;font-weight:600;margin:24px 0 12px;color:#5a3a1a;font-family:var(--font-display);letter-spacing:.02em}
h3.sub-title::after{content:'';display:block;width:42px;height:2px;background:linear-gradient(90deg,var(--accent2),transparent);margin-top:4px;border-radius:1px}
.highlight{color:var(--accent);font-weight:600}

/* ---------- 用户分群卡片 ---------- */
.segment-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;border-top:3px solid var(--accent);box-shadow:var(--shadow)}
.segment-card .seg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.segment-card .seg-name{font-size:16px;font-weight:700;font-family:var(--font-display);color:#5a3a1a}
.segment-card .seg-count{font-size:12px;padding:3px 10px;border-radius:4px;background:rgba(168,80,28,.1);color:var(--accent);font-weight:600}
.segment-card .seg-desc{font-size:13px;color:var(--soft);margin-bottom:10px;line-height:1.7}
.segment-card .seg-members{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.segment-card .seg-member{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--panel2);color:var(--soft);border:1px solid var(--border-soft)}
.segment-card .seg-key{font-size:12px;color:var(--muted);margin-top:8px}
.segment-card .seg-key strong{color:var(--accent)}

/* ---------- 优先级徽章 ---------- */
.priority-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.05em}
.priority-P0{background:rgba(188,75,52,.12);color:var(--danger);border:1px solid rgba(188,75,52,.3)}
.priority-P1{background:rgba(201,147,46,.14);color:var(--warn);border:1px solid rgba(201,147,46,.3)}
.priority-P2{background:rgba(168,80,28,.1);color:var(--accent);border:1px solid rgba(168,80,28,.3)}
.priority-P3{background:var(--panel2);color:var(--muted);border:1px solid var(--border-soft)}

/* ---------- 变化/一致性 ---------- */
.change-up{color:var(--success);font-weight:600}
.change-down{color:var(--danger);font-weight:600}
.change-same{color:var(--muted);font-weight:600}
.consistency-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.consistency-yes{background:rgba(110,148,79,.12);color:var(--success)}
.consistency-no{background:rgba(188,75,52,.12);color:var(--danger)}
.consistency-partial{background:rgba(201,147,46,.14);color:var(--warn)}

/* ---------- 体验架构 ---------- */
.arch-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.arch-core{text-align:center;font-size:15px;font-weight:600;color:var(--accent);padding:12px 20px;background:rgba(168,80,28,.07);border-radius:8px;margin-bottom:16px}
.arch-modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.arch-modes{grid-template-columns:1fr}}
.arch-mode{background:var(--panel2);border:1px solid var(--border-soft);border-radius:8px;padding:16px}
.arch-mode .mode-name{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--accent)}
.arch-mode .mode-desc{font-size:12px;color:var(--soft);margin-bottom:4px}
.arch-mode .mode-focus{font-size:11px;color:var(--muted)}
.arch-layers{display:flex;gap:12px;flex-wrap:wrap}
.arch-layer{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--border-soft);border-radius:8px;padding:14px;text-align:center}
.arch-layer .layer-name{font-size:13px;font-weight:600;margin-bottom:4px;color:#5a3a1a}
.arch-layer .layer-desc{font-size:11px;color:var(--soft);margin-bottom:6px}

/* ---------- 洞察卡片 ---------- */
.insight-card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.insight-card .ic-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.insight-card .ic-num{font-size:12px;width:28px;height:28px;border-radius:50%;background:linear-gradient(160deg,#94481a,#a8501c);color:#fdf3e2;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-family:var(--font-display)}
.insight-card .ic-title{font-size:15px;font-weight:600;color:#4a3018}
.insight-card .ic-desc{font-size:13px;color:var(--soft);line-height:1.8;margin-bottom:10px}
.insight-card .ic-evidence{font-size:12px;color:var(--muted);font-style:italic;padding:8px 12px;background:var(--panel2);border-radius:6px}
.insight-card .ic-tag{font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(168,80,28,.1);color:var(--accent);font-weight:600}

/* ---------- 合并对比卡 ---------- */
.merge-person{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:0;margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.merge-person .mp-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(180deg,var(--panel2),#f3e9d6);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.merge-person .mp-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;font-family:var(--font-display);color:#5a3a1a}
.merge-person .mp-body{padding:16px 20px}
.merge-person .mp-row{display:grid;grid-template-columns:120px 1fr 1fr 1fr;gap:12px;padding:8px 0;border-bottom:1px solid rgba(160,120,60,.1);align-items:start}
@media(max-width:900px){.merge-person .mp-row{grid-template-columns:1fr;gap:4px}}
.merge-person .mp-row-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.merge-person .mp-survey{font-size:12px;color:var(--soft)}
.merge-person .mp-interview{font-size:12px;color:var(--soft)}
.merge-person .mp-analysis{font-size:12px;color:var(--soft)}
.merge-person .mp-col-header{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px}
</style>
</head>
