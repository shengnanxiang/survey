<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiKen 1对1访谈分析报告</title>
<style>
/* ============ 90s SKATE ARCHIVE · 杂志风 ============ */
:root{
  --paper:#f0efe6;        /* 带颗粒米白纸 */
  --paper-dark:#e6e4d6;
  --ink:#0f0f0f;          /* 纯黑 */
  --ink-2:#2a2a2a;
  --gray:#6b6b6b;
  --muted:#8a8a7a;
  --accent:#0e6fd6;       /* 档案蓝 */
  --accent-dark:#0a53a8;
  --success:#1a7a3e;
  --warn:#b87d00;
  --danger:#b22222;
  --radius:0;
  --font-display:Impact,Haettenschweiler,"Arial Narrow Bold","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --maxw:1100px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.55}
body{
  display:flex;flex-direction:column;min-height:100vh;
  background-image:
    radial-gradient(circle at 20% 10%,rgba(14,111,214,.03) 0,transparent 25%),
    radial-gradient(circle at 80% 90%,rgba(0,0,0,.03) 0,transparent 30%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  background-size:cover,cover,220px 220px;
}

/* ---------- 顶部黑头条 ---------- */
.toolbar{
  padding:0;background:var(--ink);color:#f6f5ec;position:sticky;top:0;z-index:10;
  border-bottom:6px solid var(--accent);
}
.toolbar-inner{max-width:var(--maxw);margin:0 auto;width:100%;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.toolbar h1{font-size:34px;font-weight:900;font-family:var(--font-display);letter-spacing:.03em;text-transform:uppercase;line-height:1}
.toolbar h1 span{color:#f6f5ec;-webkit-text-stroke:1.2px #f6f5ec}
.toolbar-right{display:flex;align-items:center;gap:18px}
.toolbar-right .meta{font-size:12px;color:var(--paper-dark);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-family:var(--font-mono)}
.btn-back{padding:5px 12px;font-size:11px;border-radius:0;background:transparent;border:1.5px solid #f6f5ec;color:#f6f5ec;cursor:pointer;text-decoration:none;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.btn-back:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- 导航标签 ---------- */
.nav-tabs{display:flex;gap:0;max-width:var(--maxw);margin:0 auto;padding:0 28px;flex-wrap:wrap;border-bottom:3px solid var(--ink);background:var(--paper-dark)}
.nav-tab{
  padding:12px 22px;border:0;border-right:2px solid var(--ink);background:var(--paper-dark);color:var(--ink-2);
  font-size:14px;font-weight:900;cursor:pointer;font-family:var(--font-display);letter-spacing:.04em;text-transform:uppercase;transition:all .15s;
}
.nav-tab:hover{background:var(--ink);color:#f6f5ec}
.nav-tab.active{background:var(--accent);color:#fff}
.nav-tab:last-child{border-right:0}

/* ---------- 主内容区 ---------- */
.main{flex:1;overflow-y:auto;padding:30px 28px 70px;scrollbar-width:thin;scrollbar-color:var(--ink) transparent}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--ink)}
.main-inner{max-width:var(--maxw);margin:0 auto;width:100%}
.section{margin-bottom:40px;display:none}.section.active{display:block}

/* ---------- 大标题区 ---------- */
.section-title{
  font-size:46px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;gap:14px;
  font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;line-height:1.1;color:var(--ink);
}
.section-title::before{content:'';width:10px;height:46px;background:var(--accent);flex-shrink:0}
.section-desc{font-size:14px;color:var(--gray);margin-bottom:26px;padding-left:24px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}

/* ---------- 核心数据卡片 ---------- */
.summary-row{display:flex;gap:0;margin-bottom:28px;flex-wrap:wrap;border:3px solid var(--ink)}
.summary-card{
  flex:1;min-width:150px;background:#fff;border-right:3px solid var(--ink);padding:22px 20px 18px;transition:all .15s;
}
.summary-card:last-child{border-right:0}
.summary-card:hover{background:var(--paper-dark)}
.summary-card .label{font-size:11px;color:var(--gray);margin-bottom:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-family:var(--font-mono)}
.summary-card .value{font-size:42px;font-weight:900;font-family:var(--font-display);line-height:1;color:var(--ink)}
.summary-card .sub{font-size:11px;color:var(--muted);margin-top:4px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.card-pos .value{color:var(--success)}
.card-neu .value{color:var(--warn)}
.card-neg .value{color:var(--danger)}

/* ---------- 通用卡片 ---------- */
.insight-box{background:#fff;border:3px solid var(--ink);padding:22px 26px;margin-bottom:20px;box-shadow:6px 6px 0 rgba(0,0,0,.12)}
.insight-box h3{font-size:18px;font-weight:900;margin-bottom:12px;color:var(--ink);font-family:var(--font-display);letter-spacing:.02em;text-transform:uppercase}
.insight-box ul{list-style:none;padding:0}
.insight-box ul li{font-size:15px;color:var(--ink-2);padding:5px 0 5px 20px;position:relative;line-height:1.6;font-weight:600}
.insight-box ul li::before{content:'>';position:absolute;left:0;color:var(--accent);font-weight:900;font-family:var(--font-mono)}

/* ---------- 个人卡片 ---------- */
.person-card{background:#fff;border:3px solid var(--ink);padding:24px;margin-bottom:20px;box-shadow:6px 6px 0 rgba(0,0,0,.12);transition:all .15s}
.person-card:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 rgba(0,0,0,.16)}
.person-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.person-name{font-size:24px;font-weight:900;display:flex;align-items:center;gap:10px;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.person-tag{font-size:11px;padding:3px 10px;border:2px solid var(--ink);font-weight:900;text-transform:uppercase;letter-spacing:.04em;background:#fff}
.tag-pos{background:var(--success);color:#fff;border-color:var(--success)}
.tag-neu{background:var(--warn);color:#fff;border-color:var(--warn)}
.tag-neg{background:var(--danger);color:#fff;border-color:var(--danger)}
.tag-warn{background:#fff;color:var(--warn);border-color:var(--warn)}
.person-meta{display:flex;gap:8px;flex-wrap:wrap}
.meta-chip{font-size:11px;padding:3px 10px;border:2px solid var(--ink);background:#fff;color:var(--ink-2);font-weight:800;letter-spacing:.04em}
.person-body{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:700px){.person-body{grid-template-columns:1fr}}
.person-field .field-label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;margin-top:12px;font-weight:900;font-family:var(--font-mono)}
.person-field .field-value{font-size:15px;color:var(--ink-2);margin-bottom:8px;font-weight:700}
.quote-block{background:var(--paper-dark);border-left:5px solid var(--accent);padding:12px 18px;margin:8px 0;font-size:15px;color:var(--ink-2);font-weight:700;line-height:1.55}
.quote-block::before{content:'\201C';font-size:28px;color:var(--accent);margin-right:6px;font-family:Georgia,serif}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto;margin-bottom:20px;border:3px solid var(--ink);background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--ink);color:#f6f5ec;padding:14px 16px;text-align:left;font-weight:900;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;font-family:var(--font-display);font-size:13px}
td{padding:12px 16px;border-bottom:2px solid var(--ink);color:var(--ink-2);vertical-align:top;font-weight:700}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--paper-dark)}
.att-up{color:var(--success);font-weight:900}.att-down{color:var(--danger);font-weight:900}.att-same{color:var(--gray);font-weight:900}

/* ---------- 图表 ---------- */
.chart-box{background:#fff;border:3px solid var(--ink);padding:22px 26px;margin-bottom:20px;box-shadow:6px 6px 0 rgba(0,0,0,.12)}
.chart-title{font-size:20px;font-weight:900;margin-bottom:18px;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{width:120px;flex-shrink:0;text-align:right;font-size:13px;color:var(--ink-2);white-space:nowrap;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.bar-track{flex:1;height:30px;background:var(--paper-dark);overflow:hidden;border:2px solid var(--ink)}
.bar-fill{height:100%;background:var(--accent);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:12px;color:#fff;font-weight:900;letter-spacing:.03em;font-family:var(--font-mono)}
.bar-fill.green{background:var(--success)}
.bar-fill.red{background:var(--danger)}
.bar-fill.orange{background:var(--warn)}

/* ---------- 提示条 ---------- */
.callout{background:#fff;border:3px solid var(--success);padding:18px 22px;margin-bottom:16px;font-size:15px;color:var(--ink-2);font-weight:700;box-shadow:5px 5px 0 rgba(0,0,0,.1)}
.callout.warn{border-color:var(--warn)}
.callout.danger{border-color:var(--danger)}
.callout strong{color:var(--ink);font-weight:900}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}
.divider{height:4px;background:var(--ink);margin:30px 0}
.footer{max-width:var(--maxw);margin:0 auto;width:100%;text-align:center;padding:22px;font-size:12px;color:var(--gray);border-top:3px solid var(--ink);background:var(--paper-dark);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
p{font-size:16px;color:var(--ink-2);margin-bottom:14px;line-height:1.7;font-weight:700}
h3.sub-title{font-size:24px;font-weight:900;margin:28px 0 14px;color:var(--ink);font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em}
h3.sub-title::after{content:'';display:block;width:60px;height:6px;background:var(--accent);margin-top:6px}
.highlight{color:var(--accent-dark);font-weight:900}

/* ---------- 用户分群卡片 ---------- */
.segment-card{background:#fff;border:3px solid var(--ink);padding:22px 26px;margin-bottom:16px;box-shadow:6px 6px 0 rgba(0,0,0,.12);border-top:8px solid var(--accent)}
.segment-card .seg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.segment-card .seg-name{font-size:22px;font-weight:900;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.segment-card .seg-count{font-size:12px;padding:3px 12px;border:2px solid var(--ink);background:var(--accent);color:#fff;font-weight:900}
.segment-card .seg-desc{font-size:15px;color:var(--ink-2);margin-bottom:10px;line-height:1.65;font-weight:700}
.segment-card .seg-members{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.segment-card .seg-member{font-size:12px;padding:3px 10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink-2);font-weight:800}
.segment-card .seg-key{font-size:13px;color:var(--gray);margin-top:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.segment-card .seg-key strong{color:var(--accent);font-weight:900}

/* ---------- 优先级徽章 ---------- */
.priority-badge{font-size:11px;padding:3px 10px;border:2px solid var(--ink);font-weight:900;letter-spacing:.06em}
.priority-P0{background:var(--danger);color:#fff;border-color:var(--danger)}
.priority-P1{background:var(--warn);color:#fff;border-color:var(--warn)}
.priority-P2{background:var(--accent);color:#fff;border-color:var(--accent)}
.priority-P3{background:#fff;color:var(--gray);border-color:var(--ink)}

/* ---------- 体验架构 ---------- */
.arch-box{background:#fff;border:3px solid var(--ink);padding:26px;margin-bottom:20px;box-shadow:6px 6px 0 rgba(0,0,0,.12)}
.arch-core{text-align:center;font-size:18px;font-weight:900;color:#fff;padding:16px 24px;background:var(--ink);margin-bottom:18px;font-family:var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.arch-modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.arch-modes{grid-template-columns:1fr}}
.arch-mode{background:var(--paper-dark);border:3px solid var(--ink);padding:16px}
.arch-mode .mode-name{font-size:16px;font-weight:900;margin-bottom:6px;color:var(--ink);font-family:var(--font-display);text-transform:uppercase}
.arch-mode .mode-desc{font-size:14px;color:var(--ink-2);margin-bottom:4px;font-weight:700}
.arch-mode .mode-focus{font-size:11px;color:var(--gray);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.arch-layers{display:flex;gap:12px;flex-wrap:wrap}
.arch-layer{flex:1;min-width:180px;background:var(--paper-dark);border:3px solid var(--ink);padding:16px;text-align:center}
.arch-layer .layer-name{font-size:15px;font-weight:900;margin-bottom:4px;color:var(--ink);text-transform:uppercase}
.arch-layer .layer-desc{font-size:12px;color:var(--gray);margin-bottom:8px;font-weight:800}

/* ---------- 洞察卡片 ---------- */
.insight-card{background:#fff;border:3px solid var(--ink);padding:22px 26px;margin-bottom:16px;box-shadow:6px 6px 0 rgba(0,0,0,.12)}
.insight-card .ic-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.insight-card .ic-num{font-size:15px;width:34px;height:34px;border-radius:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;font-family:var(--font-display);border:2px solid var(--ink)}
.insight-card .ic-title{font-size:18px;font-weight:900;color:var(--ink);font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;flex:1}
.insight-card .ic-desc{font-size:15px;color:var(--ink-2);line-height:1.7;margin-bottom:12px;font-weight:700}
.insight-card .ic-evidence{font-size:13px;color:var(--gray);font-style:italic;padding:10px 14px;background:var(--paper);border-left:4px solid var(--accent);font-weight:700}
.insight-card .ic-tag{font-size:11px;padding:3px 10px;border:2px solid var(--ink);background:var(--paper-dark);color:var(--ink);font-weight:900;letter-spacing:.04em}

</style>
</head>
<body>
<div class="toolbar">
<div class="toolbar-inner">
<h1>AiKen <span>访谈档案</span></h1>
<div class="toolbar-right"><span class="meta">10受访者 · 2026</span><a href="index.html" class="btn-back">返回首页</a></div>
</div>
</div>
<div class="nav-tabs">
<button class="nav-tab active" onclick="showSection('overview',this)">概览</button>
<button class="nav-tab" onclick="showSection('insights',this)">核心洞察</button>
<button class="nav-tab" onclick="showSection('attitude',this)">态度变化</button>
<button class="nav-tab" onclick="showSection('analysis',this)">访谈详析</button>
</div>
<div class="main" id="main"><div class="main-inner" id="main-inner"></div></div>
<div class="footer">AiKen 用户调研 · 访谈分析报告 · 2026年8月</div>
<script src="report-data.js"></script>
<script src="report-render.js"></script>
</body>
</html>
