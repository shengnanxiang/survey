<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiKen 1对1访谈分析报告</title>
<style>
:root{--bg:#0e1220;--panel:#171c2e;--panel2:#1d2338;--border:#262c44;--text:#e8ecf5;--soft:#b3bacd;--muted:#7d859e;--accent:#7c9bff;--accent2:#a48bff;--success:#3ecf8e;--warn:#f7b955;--danger:#e0558a;--radius:12px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.7}
body{display:flex;flex-direction:column;min-height:100vh}
.toolbar{padding:16px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg);position:sticky;top:0;z-index:10}
.toolbar h1{font-size:20px;font-weight:700}.toolbar h1 span{color:var(--accent)}
.toolbar-right{display:flex;align-items:center;gap:16px}
.toolbar-right .meta{font-size:12px;color:var(--muted)}
.btn-back{padding:5px 10px;font-size:11px;border-radius:4px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--soft);cursor:pointer;text-decoration:none;font-family:var(--font)}
.btn-back:hover{color:var(--text);border-color:var(--accent)}
.nav-tabs{display:flex;gap:4px;padding:0 28px;margin-top:16px;flex-wrap:wrap}
.nav-tab{padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--soft);font-size:13px;cursor:pointer;font-family:var(--font);transition:all .2s}
.nav-tab:hover{border-color:rgba(255,255,255,.3);color:var(--text)}
.nav-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.main{flex:1;overflow-y:auto;padding:24px 28px 60px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.main::-webkit-scrollbar{width:5px}.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
.section{margin-bottom:36px;display:none}.section.active{display:block}
.section-title{font-size:22px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:4px;height:24px;background:var(--accent);border-radius:2px;flex-shrink:0}
.section-desc{font-size:13px;color:var(--muted);margin-bottom:24px;padding-left:14px}
.summary-row{display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.summary-card{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;transition:all .25s}
.summary-card:hover{border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.summary-card .label{font-size:12px;color:var(--muted);margin-bottom:8px}
.summary-card .value{font-size:28px;font-weight:700}
.summary-card .sub{font-size:11px;color:var(--muted);margin-top:4px}
.card-pos .value{color:var(--success)}.card-neu .value{color:var(--warn)}.card-neg .value{color:var(--danger)}
.insight-box{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px}
.insight-box h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--accent)}
.insight-box ul{list-style:none;padding:0}
.insight-box ul li{font-size:13px;color:var(--soft);padding:4px 0 4px 18px;position:relative}
.insight-box ul li::before{content:'\25B8';position:absolute;left:0;color:var(--accent)}
.person-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;transition:all .2s}
.person-card:hover{border-color:rgba(255,255,255,.15)}
.person-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.person-name{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.person-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.tag-pos{background:rgba(62,207,142,.15);color:var(--success)}
.tag-neu{background:rgba(247,185,85,.15);color:var(--warn)}
.tag-neg{background:rgba(224,85,138,.15);color:var(--danger)}
.tag-warn{background:rgba(247,185,85,.1);color:var(--warn);border:1px solid rgba(247,185,85,.3)}
.person-meta{display:flex;gap:8px;flex-wrap:wrap}
.meta-chip{font-size:11px;padding:3px 10px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
.person-body{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.person-body{grid-template-columns:1fr}}
.person-field .field-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;margin-top:10px}
.person-field .field-value{font-size:13px;color:var(--soft);margin-bottom:8px}
.quote-block{background:rgba(124,155,255,.06);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 16px;margin:8px 0;font-size:13px;color:var(--soft);font-style:italic}
.quote-block::before{content:'\201C';font-size:20px;color:var(--accent);margin-right:4px}
.table-wrap{overflow-x:auto;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--panel2);padding:12px 14px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--soft);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}
.att-up{color:var(--success);font-weight:600}.att-down{color:var(--danger);font-weight:600}.att-same{color:var(--muted)}
.chart-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px}
.chart-title{font-size:14px;font-weight:600;margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{width:130px;flex-shrink:0;text-align:right;font-size:12px;color:var(--soft);white-space:nowrap}
.bar-track{flex:1;height:22px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#fff;font-weight:600}
.bar-fill.green{background:linear-gradient(90deg,#3ecf8e,#4dc9f6)}
.bar-fill.red{background:linear-gradient(90deg,#e0558a,#f7b955)}
.bar-fill.orange{background:linear-gradient(90deg,#f7b955,#ff9f43)}
.callout{background:rgba(62,207,142,.06);border:1px solid rgba(62,207,142,.2);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;font-size:13px;color:var(--soft)}
.callout.warn{background:rgba(247,185,85,.06);border-color:rgba(247,185,85,.2)}
.callout.danger{background:rgba(224,85,138,.06);border-color:rgba(224,85,138,.2)}
.callout strong{color:var(--text)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}
.divider{height:1px;background:var(--border);margin:28px 0}
.footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
p{font-size:14px;color:var(--soft);margin-bottom:12px;line-height:1.8}
h3.sub-title{font-size:16px;font-weight:600;margin:20px 0 12px;color:var(--text)}
.highlight{color:var(--accent);font-weight:600}
/* 新增样式 */
.segment-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;border-top:3px solid var(--accent)}
.segment-card .seg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.segment-card .seg-name{font-size:16px;font-weight:700}
.segment-card .seg-count{font-size:12px;padding:3px 10px;border-radius:4px;background:rgba(124,155,255,.15);color:var(--accent);font-weight:600}
.segment-card .seg-desc{font-size:13px;color:var(--soft);margin-bottom:10px;line-height:1.7}
.segment-card .seg-members{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.segment-card .seg-member{font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--soft);border:1px solid var(--border)}
.segment-card .seg-key{font-size:12px;color:var(--muted);margin-top:8px}
.segment-card .seg-key strong{color:var(--accent)}
.priority-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.05em}
.priority-P0{background:rgba(224,85,138,.15);color:var(--danger);border:1px solid rgba(224,85,138,.3)}
.priority-P1{background:rgba(247,185,85,.15);color:var(--warn);border:1px solid rgba(247,185,85,.3)}
.priority-P2{background:rgba(124,155,255,.15);color:var(--accent);border:1px solid rgba(124,255,255,.3)}
.priority-P3{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
.change-up{color:var(--success);font-weight:600}
.change-down{color:var(--danger);font-weight:600}
.change-same{color:var(--muted);font-weight:600}
.consistency-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.consistency-yes{background:rgba(62,207,142,.15);color:var(--success)}
.consistency-no{background:rgba(224,85,138,.15);color:var(--danger)}
.consistency-partial{background:rgba(247,185,85,.15);color:var(--warn)}
.arch-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
.arch-core{text-align:center;font-size:15px;font-weight:600;color:var(--accent);padding:12px 20px;background:rgba(124,155,255,.08);border-radius:8px;margin-bottom:16px}
.arch-modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.arch-modes{grid-template-columns:1fr}}
.arch-mode{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:16px}
.arch-mode .mode-name{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--accent)}
.arch-mode .mode-desc{font-size:12px;color:var(--soft);margin-bottom:4px}
.arch-mode .mode-focus{font-size:11px;color:var(--muted)}
.arch-layers{display:flex;gap:12px;flex-wrap:wrap}
.arch-layer{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.arch-layer .layer-name{font-size:13px;font-weight:600;margin-bottom:4px}
.arch-layer .layer-desc{font-size:11px;color:var(--soft);margin-bottom:6px}
.insight-card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px}
.insight-card .ic-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.insight-card .ic-num{font-size:12px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.insight-card .ic-title{font-size:15px;font-weight:600}
.insight-card .ic-desc{font-size:13px;color:var(--soft);line-height:1.8;margin-bottom:10px}
.insight-card .ic-evidence{font-size:12px;color:var(--muted);font-style:italic;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:6px}
.insight-card .ic-tag{font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(124,155,255,.15);color:var(--accent);font-weight:600}
.merge-person{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:0;margin-bottom:16px;overflow:hidden}
.merge-person .mp-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--panel2);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.merge-person .mp-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.merge-person .mp-body{padding:16px 20px}
.merge-person .mp-row{display:grid;grid-template-columns:120px 1fr 1fr 1fr;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:start}
@media(max-width:900px){.merge-person .mp-row{grid-template-columns:1fr;gap:4px}}
.merge-person .mp-row-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.merge-person .mp-survey{font-size:12px;color:var(--soft)}
.merge-person .mp-interview{font-size:12px;color:var(--soft)}
.merge-person .mp-analysis{font-size:12px;color:var(--soft)}
.merge-person .mp-col-header{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px}
</style>
</head>
<body>
<div class="toolbar">
<h1>AiKen <span>1对1访谈分析报告</span></h1>
<div class="toolbar-right"><span class="meta">12位受访者 · 2026年8月</span><a href="index.html" class="btn-back">返回首页</a></div>
</div>
<div class="nav-tabs">
<button class="nav-tab active" onclick="showSection('overview',this)">概览</button>
<button class="nav-tab" onclick="showSection('insights',this)">核心洞察</button>
<button class="nav-tab" onclick="showSection('merge',this)">调研×访谈合并</button>
<button class="nav-tab" onclick="showSection('analysis',this)">访谈详析</button>
</div>
<div class="main" id="main"></div>
<div class="footer">AiKen 用户调研 · 访谈分析报告 · 2026年8月</div>
<script src="report-data.js"></script>
<script src="report-render.js"></script>
</body>
</html>
