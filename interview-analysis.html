<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiKen 访谈分析报告</title>
<style>
/* ============ Google Material Design · 访谈分析报告 ============ */
:root{
  --primary:#0b57d0;
  --on-primary:#ffffff;
  --primary-container:#d3e3fd;
  --on-primary-container:#041e49;
  --accent:#0b57d0;            /* 兼容旧 JS 引用 */
  --accent-dark:#0842a0;
  --surface:#ffffff;
  --surface-bg:#f8f9fa;
  --surface-container:#f1f3f4;
  --surface-container-high:#e9eef5;
  --on-surface:#1f1f1f;
  --on-surface-variant:#444746;
  --muted:#5f6368;
  --outline-variant:#dadce0;
  --success:#188038;
  --success-container:#ceead6;
  --on-success-container:#0b3520;
  --warn:#b06000;
  --warn-container:#ffe1c5;
  --on-warn-container:#492905;
  --danger:#b3261e;
  --danger-container:#f9dedc;
  --on-danger-container:#410e0b;
  --radius:16px;
  --radius-s:8px;
  --font:"Google Sans","Product Sans",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:"Google Sans Mono","Roboto Mono",Consolas,"Courier New",monospace;
  --maxw:1080px;
  --sh-1:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --sh-2:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  --sh-3:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--surface-bg);color:var(--on-surface);font-family:var(--font);line-height:1.6}
body{display:flex;flex-direction:column;min-height:100vh}

/* ---------- 顶部工具栏 ---------- */
.toolbar{background:var(--surface);border-bottom:1px solid var(--outline-variant);position:sticky;top:0;z-index:10}
.toolbar-inner{max-width:var(--maxw);margin:0 auto;width:100%;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.toolbar h1{font-size:20px;font-weight:500;letter-spacing:-.01em;color:var(--on-surface)}
.toolbar h1 span{color:var(--primary)}
.toolbar-right{display:flex;align-items:center;gap:16px}
.toolbar-right .meta{font-size:12px;color:var(--muted)}
.btn-back{padding:8px 16px;font-size:13px;border-radius:999px;background:var(--surface-container);color:var(--on-surface);cursor:pointer;text-decoration:none;font-weight:500;transition:all .15s}
.btn-back:hover{background:var(--primary-container);color:var(--on-primary-container)}

/* ---------- 导航标签 ---------- */
.nav-tabs{display:flex;gap:0;max-width:var(--maxw);margin:0 auto;padding:0 28px;flex-wrap:wrap;border-bottom:1px solid var(--outline-variant)}
.nav-tab{padding:14px 20px;border:0;background:transparent;color:var(--on-surface-variant);font-size:14px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px}
.nav-tab:hover{color:var(--on-surface);background:var(--surface-container)}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* ---------- 主内容区 ---------- */
.main{flex:1;overflow-y:auto;padding:32px 28px 80px}
.main-inner{max-width:var(--maxw);margin:0 auto;width:100%}
.section{margin-bottom:40px;display:none}.section.active{display:block}

/* ---------- 大标题区 ---------- */
.section-title{font-size:30px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px;color:var(--on-surface)}
.section-desc{font-size:14px;color:var(--muted);margin-bottom:28px}

/* ---------- 核心数据卡片 ---------- */
.summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:28px}
.summary-card{background:var(--surface);border-radius:16px;padding:20px;box-shadow:var(--sh-1);transition:box-shadow .15s}
.summary-card:hover{box-shadow:var(--sh-3)}
.summary-card .label{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:500}
.summary-card .value{font-size:36px;font-weight:500;line-height:1;color:var(--on-surface)}
.summary-card .sub{font-size:12px;color:var(--muted);margin-top:6px}
.card-pos .value{color:var(--success)}
.card-neu .value{color:var(--warn)}
.card-neg .value{color:var(--danger)}

/* ---------- 通用卡片 ---------- */
.insight-box{background:var(--surface);border-radius:16px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh-1)}
.insight-box h3{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--on-surface)}
.insight-box ul{list-style:none;padding:0}
.insight-box ul li{font-size:14px;color:var(--on-surface-variant);padding:6px 0 6px 22px;position:relative;line-height:1.7}
.insight-box ul li::before{content:'·';position:absolute;left:6px;color:var(--primary);font-weight:700}

/* ---------- 个人卡片 ---------- */
.person-card{background:var(--surface);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:var(--sh-1)}
.person-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.person-name{font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--on-surface)}
.person-tag{font-size:12px;padding:4px 12px;border-radius:999px;font-weight:500}
.tag-pos{background:var(--success-container);color:var(--on-success-container)}
.tag-neu{background:var(--warn-container);color:var(--on-warn-container)}
.tag-neg{background:var(--danger-container);color:var(--on-danger-container)}
.tag-warn{background:var(--warn-container);color:var(--on-warn-container)}
.person-meta{display:flex;gap:8px;flex-wrap:wrap}
.meta-chip{font-size:12px;padding:4px 12px;border-radius:999px;background:var(--surface-container);color:var(--on-surface-variant);font-weight:500}
.person-body{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.person-body{grid-template-columns:1fr}}
.person-field .field-label{font-size:12px;color:var(--muted);letter-spacing:.02em;margin-bottom:4px;margin-top:12px;font-weight:500}
.person-field .field-value{font-size:14px;color:var(--on-surface-variant);margin-bottom:8px}
.quote-block{background:var(--primary-container);border-radius:12px;padding:12px 18px;margin:8px 0;font-size:14px;color:var(--on-primary-container);line-height:1.7;border-left:4px solid var(--primary)}
.quote-block::before{content:'“';font-size:20px;color:var(--primary);margin-right:6px}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto;margin-bottom:20px;background:var(--surface);border-radius:16px;box-shadow:var(--sh-1);padding:4px 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--surface-container);color:var(--on-surface-variant);padding:12px 16px;text-align:left;font-weight:600;white-space:nowrap;font-size:12px;letter-spacing:.02em}
td{padding:12px 16px;border-bottom:1px solid var(--outline-variant);color:var(--on-surface-variant);vertical-align:top}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--surface-container)}
.att-up{color:var(--success);font-weight:600}.att-down{color:var(--danger);font-weight:600}.att-same{color:var(--muted);font-weight:600}

/* ---------- 图表 ---------- */
.chart-box{background:var(--surface);border-radius:16px;padding:22px 26px;margin-bottom:20px;box-shadow:var(--sh-1)}
.chart-title{font-size:18px;font-weight:600;margin-bottom:18px;color:var(--on-surface)}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{width:120px;flex-shrink:0;text-align:right;font-size:13px;color:var(--on-surface-variant);white-space:nowrap}
.bar-track{flex:1;height:24px;background:var(--surface-container);border-radius:12px;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-size:12px;color:#fff;font-weight:500;min-width:44px}
.bar-fill.green{background:var(--success)}
.bar-fill.red{background:var(--danger)}
.bar-fill.orange{background:var(--warn)}

/* ---------- 提示条 ---------- */
.callout{background:var(--primary-container);border-radius:12px;padding:16px 20px;margin-bottom:16px;font-size:14px;color:var(--on-primary-container);line-height:1.7}
.callout.warn{background:var(--warn-container);color:var(--on-warn-container)}
.callout.danger{background:var(--danger-container);color:var(--on-danger-container)}
.callout strong{font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}
.divider{height:1px;background:var(--outline-variant);margin:36px 0}
.footer{max-width:var(--maxw);margin:0 auto;width:100%;text-align:center;padding:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--outline-variant)}
p{font-size:14px;color:var(--on-surface-variant);margin-bottom:16px;line-height:1.8}
h3.sub-title{font-size:20px;font-weight:600;margin:32px 0 16px;color:var(--on-surface)}
h3.sub-title::after{content:'';display:block;width:48px;height:4px;background:var(--primary);border-radius:2px;margin-top:8px}
.highlight{color:var(--primary);font-weight:600}

/* ---------- 用户分群卡片 ---------- */
.seg-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:900px){.seg-row{grid-template-columns:1fr}}
.segment-card{background:var(--surface);border-radius:16px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh-1);border-top:6px solid var(--primary);min-width:0}
.seg-row .segment-card{margin-bottom:0}
.segment-card .seg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.segment-card .seg-name{font-size:19px;font-weight:600;color:var(--on-surface)}
.segment-card .seg-count{font-size:12px;padding:4px 12px;border-radius:999px;background:var(--primary-container);color:var(--on-primary-container);font-weight:500}
.segment-card .seg-desc{font-size:14px;color:var(--on-surface-variant);margin-bottom:10px;line-height:1.7}
.segment-card .seg-members{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.segment-card .seg-chip{font-size:12px;padding:4px 12px;border-radius:999px;background:var(--surface-container);color:var(--on-surface-variant);font-weight:500}
.segment-card .seg-chip.att-pos{background:var(--success-container);color:var(--on-success-container)}
.segment-card .seg-chip.att-neu{background:var(--warn-container);color:var(--on-warn-container)}
.segment-card .seg-chip.att-neg{background:var(--danger-container);color:var(--on-danger-container)}
.segment-card .seg-key{font-size:13px;color:var(--muted);margin-top:10px}
.segment-card .seg-key strong{color:var(--primary);font-weight:600}

/* ---------- 用户画像 ---------- */
.persona-grid{display:grid;grid-template-columns:1fr;margin:14px 0 6px}
.persona-row{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:8px 0;border-bottom:1px solid var(--outline-variant);align-items:baseline}
.persona-row:last-child{border-bottom:0}
.persona-k{font-size:12px;color:var(--muted);font-weight:500}
.persona-v{font-size:14px;color:var(--on-surface-variant);line-height:1.7}
.g-trait{font-size:13px;color:var(--on-surface-variant);line-height:1.8}

/* ---------- 功能状态列 ---------- */
.st-ok{color:var(--success);font-weight:600;white-space:nowrap}
.st-track{color:var(--warn);font-weight:600;white-space:nowrap}
.st-no{color:var(--danger);font-weight:600;white-space:nowrap}

/* ---------- 优先级徽章 ---------- */
.priority-badge{font-size:12px;padding:4px 12px;border-radius:999px;font-weight:500;display:inline-block}
.priority-P0{background:var(--danger-container);color:var(--on-danger-container)}
.priority-P1{background:var(--warn-container);color:var(--on-warn-container)}
.priority-P2{background:var(--primary-container);color:var(--on-primary-container)}
.priority-P3{background:var(--surface-container);color:var(--on-surface-variant)}

/* ---------- 体验架构 ---------- */
.arch-box{background:var(--surface);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:var(--sh-1)}
.arch-core{text-align:center;font-size:17px;font-weight:600;color:var(--on-primary);padding:16px 24px;background:var(--primary);border-radius:12px;margin-bottom:18px}
.arch-modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.arch-modes{grid-template-columns:1fr}}
.arch-mode{background:var(--surface-container);border-radius:12px;padding:16px}
.arch-mode .mode-name{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--on-surface)}
.arch-mode .mode-desc{font-size:14px;color:var(--on-surface-variant);margin-bottom:4px}
.arch-mode .mode-focus{font-size:12px;color:var(--muted)}
.arch-layers{display:flex;gap:12px;flex-wrap:wrap}
.arch-layer{flex:1;min-width:180px;background:var(--surface-container);border-radius:12px;padding:16px;text-align:center}
.arch-layer .layer-name{font-size:15px;font-weight:600;margin-bottom:4px;color:var(--on-surface)}
.arch-layer .layer-desc{font-size:12px;color:var(--muted);margin-bottom:8px}

/* ---------- 洞察卡片 ---------- */
.insight-card{background:var(--surface);border-radius:16px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh-1)}
.insight-card .ic-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.insight-card .ic-num{font-size:14px;width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.insight-card .ic-title{font-size:17px;font-weight:600;color:var(--on-surface);flex:1;min-width:200px}
.insight-card .ic-desc{font-size:14px;color:var(--on-surface-variant);line-height:1.75;margin-bottom:12px}
.insight-card .ic-evidence{font-size:13px;color:var(--on-surface-variant);padding:10px 14px;background:var(--primary-container);border-radius:8px;border-left:4px solid var(--primary)}
.insight-card .ic-tag{font-size:12px;padding:4px 12px;border-radius:999px;background:var(--surface-container);color:var(--on-surface-variant);font-weight:500}

/* ---------- 假设验证卡片 ---------- */
.hypo-card{background:var(--surface);border-radius:16px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh-1);border-top:6px solid var(--primary)}
.hypo-card .hypo-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.hypo-card .hypo-id{font-size:13px;padding:4px 12px;border-radius:8px;background:var(--primary);color:#fff;font-weight:600}
.hypo-card .hypo-name{font-size:16px;font-weight:600;color:var(--on-surface);flex:1;min-width:220px;line-height:1.4}
.hypo-card .hypo-conclusion{font-size:14px;color:var(--on-surface-variant);line-height:1.75;margin-bottom:12px;padding:12px 16px;background:var(--surface-container);border-radius:8px;border-left:4px solid var(--primary)}
.hypo-card .hypo-block{margin-top:10px}
.hypo-card .hypo-label{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.03em;margin-bottom:4px}
.hypo-card .hypo-label.oppose{color:var(--danger)}
.hypo-card .quote-block{margin-bottom:6px}
.hypo-card .quote-block:last-child{margin-bottom:0}
/* 假设徽章（洞察卡片头部） */
.hypo-chip{font-size:12px;padding:4px 12px;border-radius:999px;background:var(--primary-container);color:var(--on-primary-container);font-weight:500}

/* ---------- 亲和图 ---------- */
.aff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:stretch}
@media(max-width:900px){.aff-grid{grid-template-columns:1fr}}
.aff-cluster{background:var(--surface);border-radius:16px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--sh-1);display:flex;flex-direction:column;height:100%}
.aff-grid .aff-cluster{margin-bottom:0}
.aff-cluster .aff-takeaway{margin-top:auto}
.aff-cluster .aff-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.aff-cluster .aff-id{font-size:13px;padding:4px 12px;border-radius:8px;background:var(--primary);color:#fff;font-weight:600}
.aff-cluster .aff-title{font-size:17px;font-weight:600;color:var(--on-surface);flex:1;min-width:220px;line-height:1.35}
.aff-cluster .aff-notes{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:12px}
.aff-note{display:flex;gap:10px;align-items:baseline;background:var(--surface-container);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--on-surface-variant);border-left:4px solid var(--warn)}
.aff-note .aff-who{font-weight:600;white-space:nowrap;font-size:12px;color:var(--primary)}
.aff-note .aff-quote{font-style:italic}
.aff-cluster .aff-takeaway{font-size:14px;color:var(--on-surface);line-height:1.7;padding:12px 14px;background:var(--success-container);border-radius:10px;border-left:4px solid var(--success)}

</style>
</head>

<div class="toolbar-inner">
