<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiKen 新品调研 · 数据分析看板</title>
<style>
:root {
    --bg: #0e1220; --panel: #171c2e; --border: #262c44;
    --text: #e8ecf5; --text-soft: #b3bacd; --text-muted: #7d859e;
    --accent: #7c9bff; --accent-2: #a48bff; --success: #3ecf8e;
    --warn: #f7b955; --danger: #e0558a; --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font); }
body { display:flex; flex-direction:column; }

.toolbar {
    padding: 16px 28px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    background: var(--bg); position: sticky; top:0; z-index:10;
}
.toolbar h1 { font-size: 20px; font-weight: 700; }
.toolbar-right { display:flex; align-items:center; gap:16px; }
.toolbar-right .meta { font-size:12px; color:var(--text-muted); }
.btn-back { padding:5px 10px; font-size:11px; border-radius:4px; background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--text-soft); cursor:pointer; text-decoration:none; font-family:var(--font); }
.btn-back:hover { color:var(--text); border-color:var(--accent); }

.main { flex:1; overflow-y:auto; padding:24px 28px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.08) transparent; }
.main::-webkit-scrollbar { width:5px; }
.main::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:3px; }

/* Nav tabs */
.nav-tabs { display:flex; gap:4px; margin-bottom:24px; }
.nav-tab { padding:10px 20px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text-soft); font-size:13px; cursor:pointer; font-family:var(--font); transition:all 0.2s; }
.nav-tab:hover { border-color:rgba(255,255,255,0.3); color:var(--text); }
.nav-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* Summary Cards */
.summary-row { display:flex; gap:14px; margin-bottom:28px; flex-wrap:wrap; }
.summary-card { flex:1; min-width:140px; background:var(--panel); border:2px solid var(--border); border-radius:var(--radius); padding:18px 20px; cursor:pointer; transition:all 0.25s ease; user-select:none; position:relative; overflow:hidden; }
.summary-card:hover { border-color:rgba(255,255,255,0.3); transform:translateY(-1px); }
.summary-card.active { border-color:var(--accent); box-shadow:0 0 20px rgba(124,155,255,0.15); }
.summary-card .label { font-size:12px; color:var(--text-muted); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.summary-card .value { font-size:28px; font-weight:700; }
.summary-card .sub { font-size:11px; color:var(--text-muted); margin-top:4px; }
.summary-card.active::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; border-radius:0 0 var(--radius) var(--radius); }
.summary-card.active::after { background:var(--accent); }

.card-all .value { color:var(--text); }
.card-g1 .value { color:#3ecf8e; } .card-g1.active { border-color:#3ecf8e; box-shadow:0 0 20px rgba(62,207,142,0.15); } .card-g1.active::after { background:#3ecf8e; }
.card-g2 .value { color:#7c9bff; } .card-g2.active { border-color:#7c9bff; box-shadow:0 0 20px rgba(124,155,255,0.15); } .card-g2.active::after { background:#7c9bff; }
.card-g3 .value { color:#a48bff; } .card-g3.active { border-color:#a48bff; box-shadow:0 0 20px rgba(164,139,255,0.15); } .card-g3.active::after { background:#a48bff; }
.card-pos .value { color:#3ecf8e; } .card-pos.active { border-color:#3ecf8e; box-shadow:0 0 20px rgba(62,207,142,0.15); } .card-pos.active::after { background:#3ecf8e; }
.card-neg .value { color:var(--danger); } .card-neg.active { border-color:var(--danger); box-shadow:0 0 20px rgba(224,85,138,0.15); } .card-neg.active::after { background:var(--danger); }

/* Filter indicator */
.filter-indicator { display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:8px; margin-bottom:24px; font-size:13px; color:var(--text-soft); background:rgba(124,155,255,0.08); border:1px solid rgba(124,155,255,0.2); }
.filter-indicator .clear-filter { padding:4px 10px; border-radius:4px; font-size:11px; border:1px solid var(--border); background:transparent; color:var(--text-soft); cursor:pointer; font-family:var(--font); }
.filter-indicator .clear-filter:hover { color:var(--text); border-color:var(--accent); }

/* Sections */
.section { margin-bottom:28px; }
.section-title { font-size:15px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.section-title::before { content:''; width:3px; height:16px; background:var(--accent); border-radius:2px; flex-shrink:0; }

/* Chart grid layout */
.chart-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; margin-bottom:20px; }
.chart-grid .section { margin-bottom:0; }
.chart-grid .section-title { font-size:14px; }
@media (max-width: 800px) { .chart-grid { grid-template-columns:1fr; } }

/* Bar chart */
.bar-cell { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.bar-label { width:190px; flex-shrink:0; text-align:right; font-size:12px; color:var(--text-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-track { flex:1; height:24px; background:rgba(255,255,255,0.04); border-radius:4px; overflow:hidden; position:relative; }
.bar-fill { height:100%; border-radius:4px; transition:width 0.5s ease; background:linear-gradient(90deg, var(--accent), var(--accent-2)); }
.bar-fill.green { background:linear-gradient(90deg, #3ecf8e, #4dc9f6); }
.bar-fill.red { background:linear-gradient(90deg, #e0558a, #f7b955); }
.bar-val { font-size:11px; color:var(--text-muted); width:60px; flex-shrink:0; }

/* Comparison dual bar */
.compare-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.compare-label { width:190px; flex-shrink:0; text-align:right; font-size:12px; color:var(--text-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.compare-bars { flex:1; display:flex; flex-direction:column; gap:3px; }
.compare-bar-wrap { display:flex; align-items:center; gap:6px; font-size:11px; }
.compare-bar-tag { width:42px; text-align:right; flex-shrink:0; font-weight:600; }
.compare-bar-tag.pos { color:#3ecf8e; }
.compare-bar-tag.neg { color:var(--danger); }
.compare-bar-track { flex:1; height:20px; background:rgba(255,255,255,0.04); border-radius:3px; overflow:hidden; }
.compare-bar-fill { height:100%; border-radius:3px; transition:width 0.5s ease; }
.compare-bar-fill.pos { background:linear-gradient(90deg, #3ecf8e, #4dc9f6); }
.compare-bar-fill.neg { background:linear-gradient(90deg, #e0558a, #f7b955); }
.compare-bar-val { width:44px; flex-shrink:0; font-size:10px; color:var(--text-muted); }
.compare-diff { width:48px; flex-shrink:0; font-size:11px; font-weight:600; text-align:center; }
.compare-diff.pos-diff { color:#3ecf8e; }
.compare-diff.neg-diff { color:var(--danger); }

/* Contact Grid */
.contact-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:10px; }
.contact-card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 16px; font-size:13px; display:flex; align-items:center; gap:12px; transition:border-color 0.2s; }
.contact-card:hover { border-color:rgba(255,255,255,0.2); }
.contact-avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; flex-shrink:0; color:#fff; }
.contact-info { flex:1; min-width:0; }
.contact-info .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.contact-info .detail { color:var(--text-muted); font-size:11px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.contact-tags { display:flex; gap:4px; flex-wrap:wrap; flex-shrink:0; }

/* Tags */
.tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600; letter-spacing:0.03em; white-space:nowrap; }
.tag.green { background:rgba(62,207,142,0.2); color:#3ecf8e; }
.tag.orange { background:rgba(247,185,85,0.2); color:#f7b955; }
.tag.red { background:rgba(224,85,138,0.2); color:#e0558a; }
.tag.blue { background:rgba(124,155,255,0.2); color:#7c9bff; }
.tag.purple { background:rgba(164,139,255,0.2); color:#a48bff; }
.filter-badge { display:inline-block; padding:3px 8px; border-radius:4px; font-size:10px; font-weight:600; }
.filter-badge.g1 { background:rgba(62,207,142,0.15); color:#3ecf8e; border:1px solid rgba(62,207,142,0.3); }
.filter-badge.g2 { background:rgba(124,155,255,0.15); color:#7c9bff; border:1px solid rgba(124,155,255,0.3); }
.filter-badge.g3 { background:rgba(164,139,255,0.15); color:#a48bff; border:1px solid rgba(164,139,255,0.3); }

/* Insights table */
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); }
th { color:var(--text-muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; white-space:nowrap; }
td { color:var(--text-soft); }
tr:hover td { background:rgba(255,255,255,0.02); }

/* Highlight box */
.highlight-box { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px 24px; margin-bottom:16px; }
.highlight-box h4 { font-size:14px; margin-bottom:12px; color:var(--text); }

.empty { text-align:center; padding:60px 20px; color:var(--text-muted); }

/* Insight bar */
.insight-bar { font-size:13px; color:var(--accent); padding:10px 16px; margin-bottom:12px; background:rgba(245,158,11,0.06); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; line-height:1.6; }

@media (max-width: 700px) {
    .summary-row { flex-direction:column; }
    .contact-grid { grid-template-columns:1fr; }
    .bar-label, .compare-label { width:100px; }
    .main { padding:16px; }
    .toolbar { padding:12px 16px; }
    .nav-tabs { overflow-x:auto; }
}
</style>
</head>

// ============================================================
let currentFilter = 'all';
let currentView = 'overview'; // 'overview' | 'comparison'

// ============================================================
(function init() {
    document.getElementById('respCount').textContent = SURVEY_DATA.length + ' 份回答 · 2026年';
    renderDashboard();
})();

// ============================================================
function getFilteredData() {
    if (currentFilter === 'all') return SURVEY_DATA;
    if (currentFilter === 'G1') return SURVEY_DATA.filter(r => r.groups.includes('G1'));
    if (currentFilter === 'G2') return SURVEY_DATA.filter(r => r.groups.includes('G2'));
    if (currentFilter === 'G3') return SURVEY_DATA.filter(r => r.groups.includes('G3'));
    if (currentFilter === 'positive') return SURVEY_DATA.filter(r => r.concept_reaction === '很有意思，想试试' || r.concept_reaction === '有点好奇，但不确定自己会不会用');
    if (currentFilter === 'negative') return SURVEY_DATA.filter(r => r.concept_reaction === '听起来有点麻烦' || r.concept_reaction === '完全不感兴趣');
    return SURVEY_DATA;
}

function setFilter(f) { currentFilter = f; renderDashboard(); document.getElementById('mainContent').scrollTop = 0; }
function setView(v) { currentView = v; currentFilter = 'all'; renderDashboard(); document.getElementById('mainContent').scrollTop = 0; }

// ============================================================
function renderDashboard() {
    const html = renderNavTabs() + (
        currentView === 'overview' ? renderOverview() :
        currentView === 'comparison' ? renderComparison() :
        renderRecommendation()
    );
    document.getElementById('dashboardContent').innerHTML = html;
    bindSummaryCards();
}

function renderNavTabs() {
    return `
    <div class="nav-tabs">
        <button class="nav-tab${currentView==='overview'?' active':''}" onclick="setView('overview')">📊 全量分析</button>
        <button class="nav-tab${currentView==='comparison'?' active':''}" onclick="setView('comparison')">⚖️ 正负面态度对比</button>
        <button class="nav-tab${currentView==='recommend'?' active':''}" onclick="setView('recommend')">🎯 访谈推荐名单</button>
    </div>`;
}

        <div class="summary-row">

            <div class="summary-card card-neg active" style="cursor:default"><div class="label">🔴 负面态度</div><div class="value">${neg.length}</div><div class="sub">"麻烦" + "不感兴趣"</div></div>
        </div>
    </div>`;

    // Key differences summary
    html += `<div class="section"><div class="section-title">🔑 核心差异一览</div>`;
    html += `<div class="insight-bar">💡 正面用户 vs 负面用户的核心分水岭：<b>拍照仪式感认知</b>（每张快门经过思考 vs 不需要仪式感）和<b>社媒分享习惯</b>（有分享习惯 vs 几乎不分享）。产品定位应聚焦"有分享欲、追求仪式感"的用户群。</div>`;
    html += '<table><thead><tr><th>维度</th><th>正面组 (n='+pos.length+')</th><th>负面组 (n='+neg.length+')</th><th>差异</th></tr></thead><tbody>';

    const kp = (arr, key, val) => arr.filter(r => r[key] === val).length;
    const kpm = (arr, key, vals) => arr.filter(r => vals.includes(r[key])).length;
    const pct = (n, t) => (n/t*100).toFixed(0)+'%';

    // Q11: phone_not_enough = 经常有
    html += `<tr><td>经常感觉"手机少了点感觉"</td><td><strong style="color:#3ecf8e">${pct(kp(pos,'phone_not_enough','经常有这种感觉'),pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(kp(neg,'phone_not_enough','经常有这种感觉'),neg.length)}</strong></td><td style="color:#3ecf8e">正面高 ${(kp(pos,'phone_not_enough','经常有这种感觉')/pos.length*100 - kp(neg,'phone_not_enough','经常有这种感觉')/neg.length*100).toFixed(0)}pp</td></tr>`;

    // Ritual = 胶卷式思考
    html += `<tr><td>仪式感 = "每次快门经过思考"</td><td><strong style="color:#3ecf8e">${pct(kp(pos,'ritual','不追求完美，但每次快门都经过思考'),pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(kp(neg,'ritual','不追求完美，但每次快门都经过思考'),neg.length)}</strong></td><td style="color:#3ecf8e">正面高 ${(kp(pos,'ritual','不追求完美，但每次快门都经过思考')/pos.length*100 - kp(neg,'ritual','不追求完美，但每次快门都经过思考')/neg.length*100).toFixed(0)}pp</td></tr>`;

    // Ritual = 不需要仪式感
    html += `<tr><td>仪式感 = "不需要，快速记录就行"</td><td><strong style="color:#3ecf8e">${pct(kp(pos,'ritual','拍照不需要仪式感，快速记录就行'),pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(kp(neg,'ritual','拍照不需要仪式感，快速记录就行'),neg.length)}</strong></td><td style="color:var(--danger)">负面高 ${(kp(neg,'ritual','拍照不需要仪式感，快速记录就行')/neg.length*100 - kp(pos,'ritual','拍照不需要仪式感，快速记录就行')/pos.length*100).toFixed(0)}pp</td></tr>`;

    // Share = 几乎不分享
    html += `<tr><td>几乎不分享照片</td><td><strong style="color:#3ecf8e">${pct(kp(pos,'share_freq','几乎不分享'),pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(kp(neg,'share_freq','几乎不分享'),neg.length)}</strong></td><td style="color:var(--danger)">负面高 ${(kp(neg,'share_freq','几乎不分享')/neg.length*100 - kp(pos,'share_freq','几乎不分享')/pos.length*100).toFixed(0)}pp</td></tr>`;

    // Share = 经常/偶尔
    const posShare = kpm(pos, 'share_freq', ['经常分享（每周几次）','偶尔分享（每月几次）']);
    const negShare = kpm(neg, 'share_freq', ['经常分享（每周几次）','偶尔分享（每月几次）']);
    html += `<tr><td>有社媒分享习惯</td><td><strong style="color:#3ecf8e">${pct(posShare,pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(negShare,neg.length)}</strong></td><td style="color:#3ecf8e">正面高 ${(posShare/pos.length*100 - negShare/neg.length*100).toFixed(0)}pp</td></tr>`;

    // Photo attitude = 认真为主
    const posSerious = kpm(pos, 'photo_attitude', ['大部分想认真拍，偶尔随手记录','几乎每次都是认真对待']);
    const negSerious = kpm(neg, 'photo_attitude', ['大部分想认真拍，偶尔随手记录','几乎每次都是认真对待']);
    html += `<tr><td>拍照以认真对待为主</td><td><strong style="color:#3ecf8e">${pct(posSerious,pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(negSerious,neg.length)}</strong></td><td style="color:#3ecf8e">正面高 ${(posSerious/pos.length*100 - negSerious/neg.length*100).toFixed(0)}pp</td></tr>`;

    // G3
    const posG3 = pos.filter(r => r.groups.includes('G3')).length;
    const negG3 = neg.filter(r => r.groups.includes('G3')).length;
    html += `<tr><td>G3 潮玩购买者占比</td><td><strong style="color:#3ecf8e">${pct(posG3,pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(negG3,neg.length)}</strong></td><td style="color:#3ecf8e">正面高 ${(posG3/pos.length*100 - negG3/neg.length*100).toFixed(0)}pp</td></tr>`;

    // Interview: 很想参加
    html += `<tr><td>很想参加访谈</td><td><strong style="color:#3ecf8e">${pct(kp(pos,'interview','很想参加'),pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(kp(neg,'interview','很想参加'),neg.length)}</strong></td><td style="color:#3ecf8e">正面高 ${(kp(pos,'interview','很想参加')/pos.length*100 - kp(neg,'interview','很想参加')/neg.length*100).toFixed(0)}pp</td></tr>`;

    // Interview: 不方便
    html += `<tr><td>不太方便参加</td><td><strong style="color:#3ecf8e">${pct(kp(pos,'interview','不太方便参加'),pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(kp(neg,'interview','不太方便参加'),neg.length)}</strong></td><td style="color:var(--danger)">负面高 ${(kp(neg,'interview','不太方便参加')/neg.length*100 - kp(pos,'interview','不太方便参加')/pos.length*100).toFixed(0)}pp</td></tr>`;

    // Filter freq
    html += `<tr><td>经常使用滤镜 App</td><td><strong style="color:#3ecf8e">${pct(kp(pos,'filter_freq','经常使用（每周至少几次）'),pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(kp(neg,'filter_freq','经常使用（每周至少几次）'),neg.length)}</strong></td><td style="color:#3ecf8e">正面高 ${(kp(pos,'filter_freq','经常使用（每周至少几次）')/pos.length*100 - kp(neg,'filter_freq','经常使用（每周至少几次）')/neg.length*100).toFixed(0)}pp</td></tr>`;

    // Filter never
    html += `<tr><td>从未使用滤镜 App</td><td><strong style="color:#3ecf8e">${pct(kp(pos,'filter_freq','从未使用过'),pos.length)}</strong></td><td><strong style="color:var(--danger)">${pct(kp(neg,'filter_freq','从未使用过'),neg.length)}</strong></td><td style="color:var(--danger)">负面高 ${(kp(neg,'filter_freq','从未使用过')/neg.length*100 - kp(pos,'filter_freq','从未使用过')/pos.length*100).toFixed(0)}pp</td></tr>`;

    html += '</tbody></table></div>';

    // Detailed comparison charts
    html += `<div class="section"><div class="section-title">📊 详细分布对比</div>`;
    html += renderCompareChart(pos, neg, 'age', '年龄段', {'18-25岁':'18-25','26-35岁':'26-35','36-45岁':'36-45','46岁以上':'46+'});
    html += renderCompareChart(pos, neg, 'gender', '性别', {'男':'男','女':'女'});
    html += renderCompareChart(pos, neg, 'film_exp', '胶卷相机经历', {'是，现在还在用':'还在用','用过，但已经不用了':'用过','从没用过，但挺好奇的':'没用过但好奇','从没用过，也不太感兴趣':'不感兴趣'});
    html += renderCompareChart(pos, neg, 'instant_exp', '拍立得经历', {'是，现在还在用':'还在用','用过，但已经不用了':'用过','从没用过，但挺好奇的':'没用过但好奇','从没用过，也不太感兴趣':'不感兴趣'});
    html += renderCompareChart(pos, neg, 'filter_freq', '滤镜 App 使用频率', {'经常使用（每周至少几次）':'经常','偶尔使用（每月几次）':'偶尔','很少使用（装过但很少打开）':'很少','从未使用过':'从未'});
    html += renderCompareChart(pos, neg, 'share_freq', '社媒分享频率', {'经常分享（每周几次）':'经常','偶尔分享（每月几次）':'偶尔','几乎不分享':'几乎不'});
    html += renderCompareChart(pos, neg, 'photo_attitude', '拍照态度', {'基本都是随手记录':'基本随手','大部分是随手记录，偶尔想认真拍':'大多随手','差不多':'差不多','大部分想认真拍，偶尔随手记录':'大多认真','几乎每次都是认真对待':'每次都认真'});
    html += renderCompareChart(pos, neg, 'phone_not_enough', '"手机少了点感觉"', {'经常有这种感觉':'经常有','偶尔有':'偶尔有','好像有过几次':'有过几次','从没有过，手机拍照挺好的':'从没有过'});
    html += renderCompareChart(pos, neg, 'ritual', '拍照仪式感理解', {'精心构图、调参数、灯光线':'精心构图','不追求完美，但每次快门都经过思考':'快门思考','拍完立刻拿到实体照片':'立刻拿到','拍照不需要仪式感，快速记录就行':'不需要'});
    html += renderCompareChart(pos, neg, 'interview', '访谈意愿', {'很想参加':'很想','可以参加，但要看具体时间':'看时间','不太方便参加':'不方便'});
    html += renderCompareMultiChart(pos, neg, 'devices', '拍照设备', {'手机':'手机','专业数码相机（微单、单反）':'专业相机','拍立得':'拍立得','情怀、潮玩相机（CCD、潮玩类）':'CCD/潮玩','胶卷相机':'胶卷','运动相机（GoPro、大疆等）':'运动相机'});
    html += renderCompareMultiChart(pos, neg, 'scenes', '值得"慢慢拍"的场景', {'和朋友City Walk、探店、打卡网红点':'City Walk','旅行中的特别时刻':'旅行','朋友聚会、生日派对等':'聚会派对','一个人逛街':'一个人逛街','看展、逛博物馆等':'看展','户外徒步、露营活动':'户外','演唱会、音乐节等':'演唱会','校园日常、宿舍生活':'校园','日常遛狗、带娃':'遛狗带娃','其他':'其他'});
    html += '</div>';

    // Group distribution comparison
    html += `<div class="section"><div class="section-title">📈 分组分布对比</div>`;
    html += `<div class="insight-bar">💡 G3（潮玩购买者）在正面组占比更高（+${(posG3/pos.length*100 - negG3/neg.length*100).toFixed(0)}pp），说明<b>已有潮玩消费经验的用户更容易接受 AiKen</b>。这部分用户是早期 MVP 的理想种子用户。</div>`;
    html += '<table><thead><tr><th>分组</th><th>正面 (n='+pos.length+')</th><th>负面 (n='+neg.length+')</th><th>差异</th></tr></thead><tbody>';
    ['G1','G2','G3'].forEach(g => {
        const pc = pos.filter(r => r.groups.includes(g)).length;
        const nc = neg.filter(r => r.groups.includes(g)).length;
        const pp = pc/pos.length*100, np = nc/neg.length*100;
        const diff = pp - np;
        html += `<tr><td><span class="filter-badge ${g.toLowerCase()}">${g}</span></td>
            <td><strong style="color:#3ecf8e">${pct(pc,pos.length)} (${pc})</strong></td>
            <td><strong style="color:var(--danger)">${pct(nc,neg.length)} (${nc})</strong></td>
            <td style="color:${diff>0?'#3ecf8e':'var(--danger)'}">${diff>0?'正面':'负面'}高 ${Math.abs(diff).toFixed(0)}pp</td></tr>`;
    });
    html += '</tbody></table></div>';

    // Positive group contacts
    html += renderContacts(pos, '正面态度组联系方式');

    return html;
}

// ============================================================
// COMPARISON CHART (dual bar)
// ============================================================
function renderCompareChart(pos, neg, key, title, labelMap) {
    const vals = Object.keys(labelMap);
    const maxPct = Math.max(...vals.map(v => {
        const pp = pos.filter(r => r[key]===v).length / pos.length * 100;
        const np = neg.filter(r => r[key]===v).length / neg.length * 100;
        return Math.max(pp, np);
    }), 1);

    let html = `<div style="margin-bottom:16px;"><div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-soft)">${title}</div>`;

    vals.forEach(v => {
        const pp = pos.filter(r => r[key]===v).length / pos.length * 100;
        const np = neg.filter(r => r[key]===v).length / neg.length * 100;
        const diff = pp - np;

        html += `<div class="compare-row">
            <div class="compare-label">${labelMap[v]}</div>
            <div class="compare-bars">
                <div class="compare-bar-wrap">
                    <span class="compare-bar-tag pos">正面</span>
                    <div class="compare-bar-track"><div class="compare-bar-fill pos" style="width:${(pp/maxPct*100)}%"></div></div>
                    <span class="compare-bar-val">${pp.toFixed(0)}%</span>
                </div>
                <div class="compare-bar-wrap">
                    <span class="compare-bar-tag neg">负面</span>
                    <div class="compare-bar-track"><div class="compare-bar-fill neg" style="width:${(np/maxPct*100)}%"></div></div>
                    <span class="compare-bar-val">${np.toFixed(0)}%</span>
                </div>
            </div>
            <div class="compare-diff ${diff>0?'pos-diff':'neg-diff'}">${diff>0?'+':''}${diff.toFixed(0)}pp</div>
        </div>`;
    });

    html += '</div>';
    return html;
}

function renderCompareMultiChart(pos, neg, key, title, labelMap) {
    const vals = Object.keys(labelMap);
    const pc = {}, nc = {};
    vals.forEach(v => { pc[v]=0; nc[v]=0; });
    pos.forEach(r => { if(Array.isArray(r[key])) r[key].forEach(v => { if(pc[v]!==undefined) pc[v]++; }); });
    neg.forEach(r => { if(Array.isArray(r[key])) r[key].forEach(v => { if(nc[v]!==undefined) nc[v]++; }); });

    const maxPct = Math.max(...vals.map(v => Math.max(pc[v]/pos.length*100, nc[v]/neg.length*100)), 1);

    let html = `<div style="margin-bottom:16px;"><div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-soft)">${title}</div>`;

    vals.forEach(v => {
        const pp = pc[v] / pos.length * 100;
        const np = nc[v] / neg.length * 100;
        const diff = pp - np;

        html += `<div class="compare-row">
            <div class="compare-label">${labelMap[v]}</div>
            <div class="compare-bars">
                <div class="compare-bar-wrap">
                    <span class="compare-bar-tag pos">正面</span>
                    <div class="compare-bar-track"><div class="compare-bar-fill pos" style="width:${(pp/maxPct*100)}%"></div></div>
                    <span class="compare-bar-val">${pp.toFixed(0)}%</span>
                </div>
                <div class="compare-bar-wrap">
                    <span class="compare-bar-tag neg">负面</span>
                    <div class="compare-bar-track"><div class="compare-bar-fill neg" style="width:${(np/maxPct*100)}%"></div></div>
                    <span class="compare-bar-val">${np.toFixed(0)}%</span>
                </div>
            </div>
            <div class="compare-diff ${diff>0?'pos-diff':'neg-diff'}">${diff>0?'+':''}${diff.toFixed(0)}pp</div>
        </div>`;
    });

    html += '</div>';
    return html;
}

// ============================================================
// SINGLE CHOICE TABLE
// ============================================================
function renderSingleTable(data, key, title, pairs, insightKey) {
    const counts = {};
    pairs.forEach(([raw]) => { counts[raw] = 0; });
    data.forEach(r => { const v = r[key]; if (v && counts[v] !== undefined) counts[v]++; });
    const maxVal = Math.max(1, ...Object.values(counts));
    const insight = (insightKey && QUESTION_INSIGHTS && QUESTION_INSIGHTS[insightKey]) ? QUESTION_INSIGHTS[insightKey] : '';
    let html = `<div class="section"><div class="section-title">${title}</div>`;
    if (insight) html += `<div class="insight-bar">💡 ${insight}</div>`;
    pairs.forEach(([raw, label]) => {
        const cnt = counts[raw] || 0;
        const pct = data.length ? (cnt / data.length * 100).toFixed(0) : 0;
        html += `<div class="bar-cell"><div class="bar-label">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${(cnt/maxVal*100)}%"></div></div><div class="bar-val">${cnt} (${pct}%)</div></div>`;
    });
    html += '</div>';
    return html;
}

function renderMultiTable(data, key, title, pairs, insightKey) {
    const counts = {};
    pairs.forEach(([raw]) => { counts[raw] = 0; });
    data.forEach(r => {
        const vals = r[key];
        if (Array.isArray(vals)) vals.forEach(v => { if (counts[v] !== undefined) counts[v]++; });
    });
    const maxVal = Math.max(1, ...Object.values(counts));
    const insight = (insightKey && QUESTION_INSIGHTS && QUESTION_INSIGHTS[insightKey]) ? QUESTION_INSIGHTS[insightKey] : '';
    let html = `<div class="section"><div class="section-title">${title}</div>`;
    if (insight) html += `<div class="insight-bar">💡 ${insight}</div>`;
    pairs.forEach(([raw, label]) => {
        const cnt = counts[raw] || 0;
        html += `<div class="bar-cell"><div class="bar-label">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${(cnt/maxVal*100)}%"></div></div><div class="bar-val">${cnt}</div></div>`;
    });
    html += '</div>';
    return html;
}

// ============================================================
// CONTACTS
// ============================================================
function renderContacts(data, titleOverride) {
    const contacts = data.map(r => ({
        name: r.name && r.name !== 'nan' ? r.name : null,
        interview: r.interview, age: r.age, gender: r.gender,
        groups: r.groups, concept: r.concept_reaction,
    })).filter(c => c.name);
    if (contacts.length === 0) return '';

    const avatarColors = ['#3ecf8e','#7c9bff','#a48bff','#f7b955','#e0558a','#4dc9f6','#ff6b6b','#20b2aa'];
    const wLabel = {'很想参加':'很愿意','可以参加，但要看具体时间':'看时间','不太方便参加':'不方便'};
    const wCls = {'很想参加':'green','可以参加，但要看具体时间':'orange','不太方便参加':'red'};

    let html = `<div class="section"><div class="section-title">📞 ${titleOverride || '联系方式（'+contacts.length+' 人留下姓名）'}</div>`;
    html += '<div class="contact-grid">';

    contacts.forEach((c, i) => {
        const color = avatarColors[i % avatarColors.length];
        html += `<div class="contact-card">
            <div class="contact-avatar" style="background:${color}">${c.name[0]}</div>
            <div class="contact-info">
                <div class="name">${escapeHtml(c.name)}</div>
                <div class="detail">${c.gender||''} · ${c.age||''}${c.concept?' · '+c.concept:''}</div>
            </div>
            <div class="contact-tags">
                <span class="tag ${wCls[c.interview]||''}">${wLabel[c.interview]||c.interview}</span>
                ${c.groups.map(g => `<span class="filter-badge ${g.toLowerCase()}">${g}</span>`).join('')}
            </div>
        </div>`;
    });

    html += '</div></div>';
    return html;
}

// ============================================================
// INSIGHTS
// ============================================================
function renderInsights(data) {
    const total = data.length;
    let html = '<div class="section"><div class="section-title">🔍 关键洞察</div>';
    html += '<table><thead><tr><th>指标</th><th>数据</th></tr></thead><tbody>';

    const often = data.filter(r => r.phone_not_enough==='经常有这种感觉').length;
    const ever = data.filter(r => r.phone_not_enough==='经常有这种感觉'||r.phone_not_enough==='偶尔有').length;
    html += `<tr><td>经常感觉"手机少了点感觉"</td><td><strong>${(often/total*100).toFixed(0)}%</strong> 经常有 | ${(ever/total*100).toFixed(0)}% 至少偶尔有</td></tr>`;

    const excited = data.filter(r => r.concept_reaction==='很有意思，想试试').length;
    const positive = data.filter(r => r.concept_reaction==='很有意思，想试试'||r.concept_reaction==='有点好奇，但不确定自己会不会用').length;
    html += `<tr><td>对 AiKen 概念"想试试"</td><td><strong>${(excited/total*100).toFixed(0)}%</strong> 很有意思 | ${(positive/total*100).toFixed(0)}% 正面态度</td></tr>`;

    const thoughtful = data.filter(r => r.ritual==='不追求完美，但每次快门都经过思考').length;
    html += `<tr><td>仪式感 = "每次快门经过思考"</td><td><strong>${(thoughtful/total*100).toFixed(0)}%</strong> 与 AiKen 设计吻合</td></tr>`;

    const filmCurious = data.filter(r => r.film_exp==='从没用过，但挺好奇的').length;
    const filterUsers = data.filter(r => r.filter_freq!=='从未使用过').length;
    html += `<tr><td>胶片好奇者（没用过但好奇）</td><td><strong>${(filmCurious/total*100).toFixed(0)}%</strong> (${filmCurious}人)</td></tr>`;
    html += `<tr><td>滤镜 App 使用者</td><td><strong>${(filterUsers/total*100).toFixed(0)}%</strong> (${filterUsers}人)</td></tr>`;

    const willingAll = SURVEY_DATA.filter(r => r.interview==='很想参加').length;
    const maybeAll = SURVEY_DATA.filter(r => r.interview==='可以参加，但要看具体时间').length;
    html += `<tr><td>可触达访谈人数</td><td><strong>${willingAll+maybeAll}</strong> 人（很想 ${willingAll} + 看时间 ${maybeAll}）</td></tr>`;

    html += '</tbody></table></div>';
    return html;
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ============================================================
// RECOMMENDATION PAGE
// ============================================================
function renderRecommendation() {
    const batch1 = ['闪电', '张子璟', '刘伟钢', '雷锋', '李雨露', '王莉'];
    const batch2 = ['冯洁', '宋秋平', '朱语婷', '伍英洁', '王雅岚', '顾魏怡'];
    const allNames = [...batch1, ...batch2];
    const lookup = {};
    SURVEY_DATA.forEach(r => { if (r.name) lookup[r.name] = r; });

    let html = '';

    // Summary header
    html += `<div class="highlight-box">
        <h4>🎯 访谈推荐名单 · 共 12 人</h4>
        <p style="font-size:13px;color:var(--text-soft);margin-top:6px;line-height:1.7">
        基于问卷综合评分，结合 <strong>G1/G2/G3 分组覆盖</strong>、<strong>对 AiKen 态度多样性</strong>、<strong>年龄/性别均衡</strong> 精选而出。
        已排除项目组成员、设计师、产品经理等内部人员。
        </p>
    </div>`;

    // Batch 1
    html += `<div class="section"><div class="section-title">🥇 第一批：强烈推荐（6人）</div>`;
    html += `<p style="font-size:12px;color:var(--text-muted);margin-bottom:16px">高分全能型，分组覆盖全面，态度积极，是访谈核心产出来源。</p>`;
    html += renderRecommendCards(batch1, lookup, 'batch1');
    html += `</div>`;

    // Batch 2
    html += `<div class="section"><div class="section-title">🥈 第二批：建议进行（6人）</div>`;
    html += `<p style="font-size:12px;color:var(--text-muted);margin-bottom:16px">补充年龄/性别/态度多样性，包含负面态度用户以获取多元视角。</p>`;
    html += renderRecommendCards(batch2, lookup, 'batch2');
    html += `</div>`;

    // Coverage summary
    const allR = allNames.map(n => lookup[n]).filter(Boolean);
    const ageGroups = {'18-25岁':0,'26-35岁':0,'36-45岁':0,'46岁以上':0};
    allR.forEach(r => { if (ageGroups[r.age] !== undefined) ageGroups[r.age]++; });
    const genders = {男:0,女:0};
    allR.forEach(r => { if (genders[r.gender] !== undefined) genders[r.gender]++; });
    const gCounts = {G1:0,G2:0,G3:0};
    allR.forEach(r => r.groups.forEach(g => { if (gCounts[g] !== undefined) gCounts[g]++; }));
    const attPos = allR.filter(r => r.concept_reaction==='很有意思，想试试'||r.concept_reaction==='有点好奇，但不确定自己会不会用').length;
    const attNeg = allR.filter(r => r.concept_reaction==='听起来有点麻烦'||r.concept_reaction==='完全不感兴趣').length;
    const wYes = allR.filter(r => r.interview==='很想参加').length;
    const wMaybe = allR.filter(r => r.interview==='可以参加，但要看具体时间').length;

    html += `<div class="section"><div class="section-title">📊 覆盖情况</div>`;
    html += `<table><thead><tr><th>维度</th><th>分布</th></tr></thead><tbody>`;
    html += `<tr><td>年龄</td><td>${ageGroups['18-25岁']}人 18-25岁 / ${ageGroups['26-35岁']}人 26-35岁 / ${ageGroups['36-45岁']}人 36-45岁</td></tr>`;
    html += `<tr><td>性别</td><td>${genders['男']}男 / ${genders['女']}女</td></tr>`;
    html += `<tr><td>分组覆盖</td><td>G1 胶片好奇者 ${gCounts['G1']}人 · G2 胶卷/拍立得经历 ${gCounts['G2']}人 · G3 潮玩购买者 ${gCounts['G3']}人</td></tr>`;
    html += `<tr><td>AiKen 态度</td><td>正面 ${attPos}人 · 负面 ${attNeg}人（重点覆盖年轻目标用户中的负面态度，以理解产品门槛与转化可能）</td></tr>`;
    html += `<tr><td>访谈意愿</td><td>很想参加 ${wYes}人 · 看具体时间 ${wMaybe}人</td></tr>`;
    html += `</tbody></table></div>`;

    return html;
}

function renderRecommendCards(names, lookup, batch) {
    const avatarColors = ['#3ecf8e','#7c9bff','#a48bff','#f7b955','#e0558a','#4dc9f6'];
    const wLabel = {'很想参加':'很愿意','可以参加，但要看具体时间':'看时间'};
    const wCls = {'很想参加':'green','可以参加，但要看具体时间':'orange'};
    const attCls = {'很有意思，想试试':'green','有点好奇，但不确定自己会不会用':'orange','听起来有点麻烦':'red','完全不感兴趣':'red'};

    let html = '<div style="display:flex;flex-direction:column;gap:14px;">';
    names.forEach((name, i) => {
        const r = lookup[name];
        if (!r) return;
        const g = r.groups.length ? r.groups.join('+') : '无';
        const color = avatarColors[i % avatarColors.length];

        html += `<div class="highlight-box" style="margin-bottom:0;padding:16px 20px;">
            <div style="display:flex;align-items:flex-start;gap:14px;">
                <div style="width:40px;height:40px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;flex-shrink:0;">${name[0]}</div>
                <div style="flex:1;min-width:0;">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
                        <strong style="font-size:15px;">${escapeHtml(name)}</strong>
                        <span style="font-size:12px;color:var(--text-muted)">${r.age} · ${r.gender}</span>
                        <span class="tag ${wCls[r.interview]||''}">${wLabel[r.interview]||r.interview}</span>
                        <span class="tag ${attCls[r.concept_reaction]||''}">${r.concept_reaction.length>10?r.concept_reaction.substring(0,10)+'…':r.concept_reaction}</span>
                        ${r.groups.map(grp => `<span class="filter-badge ${grp.toLowerCase()}">${grp}</span>`).join('')}
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);line-height:1.7;">
                        📷 ${r.devices.join(' · ')}<br>
                        🎞️ 胶卷: ${r.film_exp} | 拍立得: ${r.instant_exp}<br>
                        🎨 滤镜: ${r.filter_freq} | 🛒 购买: ${r.purchased.join(' · ')}<br>
                        💭 仪式感: ${r.ritual} | 📱 社媒: ${r.share_freq}<br>
                        ${i < 6 ? '⭐ <span style="color:var(--text-soft);">推荐理由: ' + getRecommendReason(name, r) + '</span>' : ''}
                    </div>
                </div>
            </div>
        </div>`;
    });
    html += '</div>';
    return html;
}
