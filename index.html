<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiKen 用户调研</title>
    <style>
        :root {
            --bg: #000000;
            --panel-bg: #0a0a0a;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.55);
            --text-dim: rgba(255, 255, 255, 0.35);
            --accent: #ff9f43;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 520px;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }
        .logo span { color: var(--accent); }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 40px;
        }
        .cards {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .card {
            display: block;
            text-decoration: none;
            color: var(--text);
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px 24px;
            transition: border-color 0.2s, background 0.2s;
            text-align: left;
        }
        .card:hover {
            border-color: var(--accent);
            background: rgba(255, 159, 67, 0.05);
        }
        .card .card-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .card .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .card .card-meta {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 8px;
        }
        .card .card-meta span {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 159, 67, 0.15);
            color: var(--accent);
            margin-right: 6px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">AiKen<span> 用户调研</span></div>
    <p class="subtitle">请选择你要参与的调研项目</p>
    <div class="cards">
        <a class="card" href="lutpreference.html">
            <div class="card-title">风格偏好调研</div>
            <div class="card-desc">上传你的照片，体验6种仿胶卷风格滤镜，完成偏好问卷。约8-12分钟。</div>
            <div class="card-meta"><span>LUT</span> 视觉体验 + 问卷</div>
        </a>
        <a class="card" href="recruit.html">
            <div class="card-title">用户筛选与量化问卷</div>
            <div class="card-desc">拍照习惯、态度偏好与线下访谈意愿调研。纯问卷，约5分钟。</div>
            <div class="card-meta"><span>问卷</span> 筛选 + 量化</div>
        </a>
        <a class="card" href="interview-analysis.html">
            <div class="card-title">1对1访谈分析报告</div>
            <div class="card-desc">12位受访者深度访谈分析，含调研×访谈交叉对比、态度变化追踪与产品策略建议。</div>
            <div class="card-meta"><span>报告</span> 访谈分析 + 洞察</div>
        </a>
    </div>
</div>
</body>
</html>
