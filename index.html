<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiKen 用户调研</title>
    <style>
        /* ============ Google Material Design · 入口页 ============ */
        :root {
            --primary: #0b57d0;
            --on-primary: #ffffff;
            --primary-container: #d3e3fd;
            --on-primary-container: #041e49;
            --surface: #ffffff;
            --surface-bg: #f8f9fa;
            --surface-container: #f1f3f4;
            --on-surface: #1f1f1f;
            --on-surface-variant: #444746;
            --muted: #5f6368;
            --outline-variant: #dadce0;
            --font: "Google Sans", "Product Sans", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            --sh-1: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
            --sh-2: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
            --sh-3: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            min-height: 100%;
            background: var(--surface-bg);
            color: var(--on-surface);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }
        .container {
            text-align: center;
            max-width: 560px;
            width: 100%;
        }
        .logo {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }
        .logo span { color: var(--primary); font-weight: 600; }
        .subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 40px;
        }
        .cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            display: block;
            text-decoration: none;
            color: var(--on-surface);
            background: var(--surface);
            border-radius: 16px;
            padding: 24px 28px;
            box-shadow: var(--sh-1);
            transition: box-shadow 0.2s, transform 0.2s;
            text-align: left;
        }
        .card:hover {
            box-shadow: var(--sh-3);
            transform: translateY(-2px);
        }
        .card .card-title {
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--on-surface);
        }
        .card .card-desc {
            font-size: 14px;
            color: var(--on-surface-variant);
            line-height: 1.6;
        }
        .card .card-meta {
            font-size: 12px;
            color: var(--muted);
            margin-top: 14px;
        }
        .card .card-meta span {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            background: var(--primary-container);
            color: var(--on-primary-container);
            font-weight: 500;
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">AiKen<span> 用户调研</span></div>
    <p class="subtitle">请选择你要参与的调研项目</p>
    <div class="cards">
        <a class="card" href="lutpreference.html">
            <div class="card-title">风格偏好调研</div>
            <div class="card-desc">上传你的照片，体验6种仿胶卷风格滤镜，完成偏好问卷。约8-12分钟。</div>
            <div class="card-meta"><span>LUT</span> 视觉体验 + 问卷</div>
        </a>
        <a class="card" href="recruit.html">
            <div class="card-title">用户筛选与量化问卷</div>
            <div class="card-desc">拍照习惯、态度偏好与线下访谈意愿调研。纯问卷，约5分钟。</div>
            <div class="card-meta"><span>问卷</span> 筛选 + 量化</div>
        </a>
        <a class="card" href="recruit-analysis.html">
            <div class="card-title">问卷数据分析</div>
            <div class="card-desc">89份有效问卷的量化分析看板，含样本结构、态度分布、需求偏好与购买意向交叉分析。</div>
            <div class="card-meta"><span>报告</span> 问卷量化分析</div>
        </a>
        <a class="card" href="interview-analysis.html">
            <div class="card-title">访谈分析报告</div>
            <div class="card-desc">12位受访者深度访谈分析，含调研×访谈交叉对比、态度变化追踪与产品策略建议。</div>
            <div class="card-meta"><span>报告</span> 访谈分析 + 洞察</div>
        </a>
    </div>
</div>
</body>
</html>
